name = "python"
version = "0.1.0"
protocol_version = "sugar-component/1"
# Only started when the workspace census shows Python evidence.
languages = ["python"]
# sugar_lift_py_tests imports sugar_lift_python_source at load (source_fragment);
# both package src trees must be on PYTHONPATH or initialize dies before handshake.
# They go IN FRONT of the caller's PYTHONPATH, never in place of it: the caller's
# PYTHONPATH is where the project's own imports resolve.
command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="implementations/python/sugar-lift-py-tests/src:implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec python3 -m sugar_lift_py_tests.lift_rpc --rpc',
]
working_dir = "../../.."
