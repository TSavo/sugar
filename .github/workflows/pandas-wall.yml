name: Pandas Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "53 10 * * *"

permissions:
  contents: read
  issues: write

jobs:
  pandas-wall:
    name: build pandas wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2
      - name: Install Python wall inputs
        run: python -m pip install --quiet pandas

      - name: Mint recovered pandas frontier
        id: wall
        shell: bash
        run: |
          set +e
          make pandas-wall
          wall_exit=$?
          set -e
          echo "wall_exit=$wall_exit" >> "$GITHUB_OUTPUT"
          test -s .sugar/pandas-wall/frontier.json

      - name: Publish pandas telemetry vector
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/wall_frontier_telemetry.py \
            --frontier .sugar/pandas-wall/frontier.json \
            --wall pandas \
            --run-url "$RUN_URL" \
            --output .sugar/pandas-wall/telemetry.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh issue comment 4102 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/pandas-wall/telemetry.md

      - name: Upload pandas wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-wall
          path: .sugar/pandas-wall/
          if-no-files-found: error
