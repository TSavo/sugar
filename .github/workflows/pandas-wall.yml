name: Pandas Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "53 10 * * *"

permissions:
  contents: read

jobs:
  pandas-wall:
    name: build pandas wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python wall inputs
        run: python -m pip install --quiet pandas

      - name: Build and check pandas wall
        run: make pandas-wall

      - name: Upload pandas wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-wall
          path: .sugar/pandas-wall/
          if-no-files-found: ignore
