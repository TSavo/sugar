name: Pandas Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "53 10 * * *"

permissions:
  contents: read
  issues: write

jobs:
  pandas-wall:
    name: build pandas wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reuse or seed the commit's Rust build
        uses: ./.github/actions/setup-rust-cache
        with:
          mode: seed

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install b3sum
        run: |
          tools/ci-apt-install.sh b3sum
      - name: Install lift package deps
        run: |
          python -m pip install --quiet \
            -e implementations/python/sugar-lift-python-source \
            -e 'implementations/python/sugar-lift-py-tests[test]'
      - name: Install Python wall inputs
        run: python -m pip install --quiet pandas

      - name: Mint recovered pandas frontier
        id: wall
        shell: bash
        env:
          SUGAR_ENGINE_LOG: ${{ github.workspace }}/.sugar/pandas-wall-logs/engine.jsonl
          SUGAR_ENGINE_HEARTBEAT_SECONDS: "5"
          SUGAR_ENGINE_CYCLE_THRESHOLD: "8"
          SUGAR_KIT_LOG: ${{ github.workspace }}/.sugar/pandas-wall-logs/transport.jsonl
          SUGAR_KIT_LOG_LEVEL: INFO
          # One wall, one resident. Profile the ownership growth instead of
          # hiding it behind request-count process rotation.
          SUGAR_LIFT_RESIDENT_MAX_REQUESTS: unlimited
          # Cheap cumulative phase counters identify time ownership. Memory
          # tracing is deliberately separate: tracemalloc instruments every
          # allocation and turned a 13-second cold context into a 120-second
          # timeout rather than observing production behavior.
          SUGAR_KIT_PROFILE_EVERY: "25"
          SUGAR_KIT_MEMORY_PROFILE_EVERY: "0"
          # Return freed AST-parse arenas to the OS periodically so the
          # arena-fragmentation half of resident growth does not OOM the
          # runner. Cheap (no tracemalloc): /proc read + gc + malloc_trim.
          # Does not touch memory pinned by live references.
          SUGAR_KIT_TRIM_EVERY: "250"
        run: |
          # Self-hosted workspaces may retain ignored .sugar outputs. A wall
          # receipt is valid only when every artifact was minted by this run.
          rm -rf .sugar/pandas-wall
          mkdir -p .sugar/pandas-wall-logs
          : > "$SUGAR_ENGINE_LOG"
          : > "$SUGAR_KIT_LOG"
          set +e
          make pandas-wall
          wall_exit=$?
          set -e
          echo "wall_exit=$wall_exit" >> "$GITHUB_OUTPUT"
          # Frontier is the success receipt; partial runs are scored below.
          if [ -s .sugar/pandas-wall/frontier.json ]; then
            echo "has_frontier=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontier=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Write wall progress scoreboard
        if: always()
        env:
          WALL_EXIT: ${{ steps.wall.outputs.wall_exit }}
        run: |
          python tools/wall_progress_scoreboard.py --self-test
          python tools/wall_progress_scoreboard.py \
            --wall pandas \
            --wall-dir .sugar/pandas-wall \
            --logs-dir .sugar/pandas-wall-logs \
            --output .sugar/pandas-wall/progress.json \
            --exit-code "${WALL_EXIT:-1}"
          {
            echo "### pandas wall progress"
            echo '```json'
            python -c "import json,pathlib; p=pathlib.Path('.sugar/pandas-wall/progress.json'); print(p.read_text() if p.is_file() else '{}')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish pandas conservation vector + ΔR
        if: steps.wall.outputs.has_frontier == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # #4263: post-merge instrument. Mint the closed conservation vector,
          # diff against the prior #4102 ledger entry (advisory), and comment
          # the absolute vector + ΔR. Unexplained movement is loud telemetry to
          # fix forward — not a reason to have blocked the merge.
          summary_args=()
          if [ -f .sugar/pandas-wall/summary.json ]; then
            summary_args=(--summary .sugar/pandas-wall/summary.json)
          fi
          python tools/wall_frontier_telemetry.py \
            --frontier .sugar/pandas-wall/frontier.json \
            "${summary_args[@]}" \
            --wall pandas \
            --run-url "$RUN_URL" \
            --output .sugar/pandas-wall/telemetry.md \
            --vector-json-out .sugar/pandas-wall/conservation-vector.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

          : > .sugar/pandas-wall/delta.md
          python tools/wall_ledger_previous_vector.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue 4102 \
            --wall pandas \
            --skip-run "$RUN_URL" \
            --output .sugar/pandas-wall/previous-vector.json \
            || true
          if [ -s .sugar/pandas-wall/previous-vector.json ]; then
            python tools/wall_conservation_diff.py \
              --before-vector-json .sugar/pandas-wall/previous-vector.json \
              --after-vector-json .sugar/pandas-wall/conservation-vector.json \
              --wall pandas \
              --before-label "prior #4102 ledger" \
              --after-label "this mint" \
              --run-url "$RUN_URL" \
              --advisory \
              --markdown-out .sugar/pandas-wall/delta.md \
              --json-out .sugar/pandas-wall/conservation-delta.json \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            {
              echo "### pandas wall conservation ΔR"
              echo "No prior machine vector on #4102 — this mint is the ledger baseline."
            } | tee -a "$GITHUB_STEP_SUMMARY" | tee .sugar/pandas-wall/delta.md
          fi

          {
            cat .sugar/pandas-wall/telemetry.md
            echo
            cat .sugar/pandas-wall/delta.md
          } > .sugar/pandas-wall/ledger-comment.md

          gh issue comment 4102 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/pandas-wall/ledger-comment.md
          gh issue comment 4263 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/pandas-wall/ledger-comment.md

      - name: Upload pandas wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-wall
          path: |
            .sugar/pandas-wall-logs/engine.jsonl
            .sugar/pandas-wall-logs/transport.jsonl
            .sugar/pandas-wall/
          if-no-files-found: error

      - name: Enforce pandas frontier receipt
        if: always()
        env:
          WALL_EXIT: ${{ steps.wall.outputs.wall_exit }}
          HAS_FRONTIER: ${{ steps.wall.outputs.has_frontier }}
        run: |
          # Acceptance = recovered frontier.json minted + floor ratchet green.
          # Visual may still be fail-fast red; the recovered-audit lane is the
          # wall receipt (progress.json always records partials).
          if [ "${HAS_FRONTIER:-0}" != "1" ]; then
            echo "::error::pandas wall incomplete: no frontier.json (wall_exit=${WALL_EXIT:-missing}); inspect progress.json artifact"
            exit 1
          fi
          if [ "${WALL_EXIT:-1}" != "0" ]; then
            echo "::error::pandas wall frontier present but ratchet red (wall_exit=${WALL_EXIT}); inspect summary.json / floors"
            exit 1
          fi
          echo "pandas wall accepted: wall_exit=0 has_frontier=1"
