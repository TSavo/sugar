name: Python sole-construction floors (R>0 red)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sole-construction-floors:
    name: python-sole-construction-floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Permanent floors — baseline-free. R > 0 ⇒ CI red on every axis.
      # See docs/contributing/python-sole-construction.md
      - name: R_behavior_side_doors = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_zero_tolerance.py
      - name: R_ownership = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_ownership_law.py
      - name: R_factory_panic_catches_outside_audit = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_panic_catch_law.py
