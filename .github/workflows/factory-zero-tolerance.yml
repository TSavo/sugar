name: Factory zero-tolerance (R>0 red)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-zero-tolerance:
    name: factory-zero-tolerance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Law: R_behavior_side_doors > 0 ⇒ CI red.
      # Do NOT pass --baseline-file. A ratchet that greens at R=42 is not zero-tolerance.
      - name: Enumerate factory behavior-construction side doors (stable zero)
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_zero_tolerance.py
      - name: Ownership-law census (unenrolled / broad owns)
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_ownership_law.py
