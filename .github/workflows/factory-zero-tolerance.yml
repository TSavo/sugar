name: Python sole-construction floors (R>0 red)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shardCount:
        description: "Process-floor shard count"
        required: false
        default: "4"
        type: string

permissions:
  contents: read

# NO concurrency group. NO machine-wide lease (#7008).
# Process axes run as a matrix of jobs — wall clock is max(axis), not sum.
# Completeness is enrollment roll call, not a merged residual hub.
#
# SHARED ENV: each of 5 jobs was paying 91–163s env prep for 116–184s total
# job time — same identical wheelhouse N times. Prepare once; axes install
# --no-index from the artifact (same law as suite + showcase #7020).
#
# JOB LOG DOCTRINE: long floors emit named phase/count to the job log ≤30s.
# PYTHONUNBUFFERED so narration is not held in stdio buffers.
#
# LPT file shards (k=8): process axes × file-shard seats. Split key is
# longest-processing-time packing on a content-addressed file cost prior;
# equal-count only when no prior (JOB_LOG says so). Prior write-through
# makes the second run fast. Do not raise k — env tax, max_file floor.

env:
  PYTHONUNBUFFERED: "1"

jobs:
  python-test-env-prepare:
    name: python test env (shared wheelhouse)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare immutable Python test environment (once)
        id: env
        uses: ./.github/actions/python-test-environment
      - name: Upload third-party wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ steps.env.outputs.env-dir }}/wheelhouse/
          if-no-files-found: error
      - name: Pull authenticated shared Python demand table
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tools:${{ github.workspace }}/implementations/python/sugar-lift-py-tests/src:${{ github.workspace }}/implementations/python/sugar-lift-python-source/src:${{ github.workspace }}/implementations/python/sugar-source-tree/src
          SUGAR_BINARY_ALLOW_BUILD: "0"
          SUGAR_BINARY_PUBLISH: "0"
        run: |
          set -euo pipefail
          demand_dir="${RUNNER_TEMP}/python-demand-table"
          mkdir -p "$demand_dir"
          python3 -c 'import sys; from pathlib import Path; from sugar_lift_py_tests.no_call_body_attribution import pull_shared_demand_table; pull_shared_demand_table(Path(sys.argv[1]), Path(sys.argv[2]))' \
            "$GITHUB_WORKSPACE" "$demand_dir/python-demand-table.json"
          test -s "$demand_dir/python-demand-table.json"
      - name: Upload authenticated shared Python demand table
        uses: actions/upload-artifact@v4
        with:
          name: python-demand-table
          path: ${{ runner.temp }}/python-demand-table/python-demand-table.json
          if-no-files-found: error

  plan-process-floor:
    name: plan process-floor shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: derive shard matrix
        env:
          SHARD_COUNT: ${{ inputs.shardCount || '4' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          k = int(os.environ["SHARD_COUNT"])
          if not 1 <= k <= 8:
              raise SystemExit("shardCount must be between 1 and 8")
          axes = {
              "silent": ("silent_zero_tolerance.py", "R_silent"),
              "native-crash": ("native_crash_zero_tolerance.py", "R_native_crashes"),
              "bare-exception": ("bare_exception_zero_tolerance.py", "R_bare_exceptions"),
              "timeout": ("timeout_zero_tolerance.py", "R_timeouts"),
          }
          rows = []
          for axis, (script, display) in axes.items():
              for shard in range(k):
                  rows.append({"axis": axis, "axisSeat": f"{axis}-s{shard:02d}",
                               "script": script, "display": f"{display}[s{shard:02d}]",
                               "shard": shard, "shardCount": k})
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          PY

  process-floor:
    name: process-floor ${{ matrix.axisSeat }}
    needs: [plan-process-floor, python-test-env-prepare]
    runs-on: [self-hosted, Linux, X64]
    # silent is the long pole (~11min today); others ~30s once cache warm.
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-process-floor.outputs.matrix) }}
      # The planner emits exactly the requested shard count; no job-level
      # matrix context expression is needed (or legal) here.
      #
      # Previous push-triggered behavior remains k=8 by default.
      #
      # The planner emits exactly the requested shard count.
    steps:
      - uses: actions/checkout@v4
      - name: Download shared third-party wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ runner.temp }}/python-test-wheelhouse
      - name: Download authenticated shared Python demand table
        uses: actions/download-artifact@v4
        with:
          name: python-demand-table
          path: ${{ runner.temp }}/python-demand-table
      - name: Install from shared wheelhouse (no network resolve)
        uses: ./.github/actions/python-test-environment-from-wheelhouse
        with:
          wheelhouse-path: ${{ runner.temp }}/python-test-wheelhouse
      # Local path is workspace-writable (HOME/.cache is not always mkdir-able
      # on self-hosted — run 30731778056). Fleet-wide: restore/save via
      # actions/cache. Key is tip; MeasurementKey still gates corpus/file
      # content so a restored shelf cannot serve wrong population.
      # CA shelf path must be WRITABLE by the runner user.
      # Run 30731778056: mkdir "${HOME}/.cache/sugar/..." → Permission denied
      # under /home/runner/.cache on self-hosted (HOME not a safe cache root).
      # Fleet share is actions/cache restore/save, not host HOME — so use the
      # job workspace (always writable) as the local mount point.

      - name: Resolve LPT file-cost prior path
        id: lpt
        shell: bash
        run: |
          set -euo pipefail
          dir="${GITHUB_WORKSPACE}/.cache/sugar/lpt-file-costs"
          mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "SUGAR_LPT_PRIOR_DIR=$dir" >> "$GITHUB_ENV"
          echo "JOB_LOG phase=lpt-prior status=resolve dir=$dir"
      - name: Restore LPT file-cost prior (content-addressed)
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lpt.outputs.dir }}
          key: lpt-file-costs-${{ github.sha }}
          restore-keys: |
            lpt-file-costs-
      - name: Resolve process-floor CA shelf path
        id: shelf
        shell: bash
        run: |
          set -euo pipefail
          # Prefer explicit pin; else workspace-local (writable on every runner).
          if [ -n "${SUGAR_PROCESS_FLOOR_CACHE_DIR:-}" ] && [ "${SUGAR_PROCESS_FLOOR_CACHE_DIR}" != "off" ]; then
            dir="${SUGAR_PROCESS_FLOOR_CACHE_DIR}"
          else
            dir="${GITHUB_WORKSPACE}/.cache/sugar/process-floor-terminals"
          fi
          echo "process-floor shelf phase=resolve status=start dir=$dir home=${HOME:-} workspace=${GITHUB_WORKSPACE}"
          mkdir -p "$dir"
          # Prove write (Permission denied surfaces here with a named phase, not later).
          touch "$dir/.write-check" && rm -f "$dir/.write-check"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "SUGAR_PROCESS_FLOOR_CACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "process-floor shelf phase=resolve status=done dir=$dir"
      - name: Restore process-floor CA terminal shelf (fleet)
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.shelf.outputs.dir }}
          key: process-floor-term-${{ github.sha }}
          restore-keys: |
            process-floor-term-
      - name: Run process floor ${{ matrix.axis }}
        id: floor
        shell: bash
        env:
          # Tip pins the CA terminal key. Dir from shelf step (workspace + GHA cache).
          SUGAR_MEASUREMENT_TIP: ${{ github.sha }}
          SUGAR_PROCESS_FLOOR_CACHE_DIR: ${{ steps.shelf.outputs.dir }}
        run: |
          set -uo pipefail
          chmod +x tools/run_one_process_floor_axis.sh
          set +e
          bash tools/run_one_process_floor_axis.sh "${{ matrix.axis }}" "${{ matrix.script }}" "${{ matrix.shard }}" "${{ matrix.shardCount }}" "${RUNNER_TEMP}/python-demand-table/python-demand-table.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Always keep the identity report for enrollment even when residual red.
          test -f floor-axis-report.json
          exit "$code"
      # Save after every attempt so partial fills warm peers / next runs.
      # Concurrent saves of the same key: first wins; content is CA so safe.

      - name: Save LPT file-cost prior (content-addressed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lpt.outputs.dir }}
          key: lpt-file-costs-${{ github.sha }}-${{ matrix.axisSeat }}
      - name: Save process-floor CA terminal shelf (fleet)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.shelf.outputs.dir }}
          key: process-floor-term-${{ github.sha }}
      - name: Upload axis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floor-axis-${{ matrix.axisSeat }}
          path: floor-axis-report.json
          if-no-files-found: error

  static-floors:
    name: static-floors
    needs: [python-test-env-prepare]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download shared third-party wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ runner.temp }}/python-test-wheelhouse
      - name: Install from shared wheelhouse (no network resolve)
        uses: ./.github/actions/python-test-environment-from-wheelhouse
        with:
          wheelhouse-path: ${{ runner.temp }}/python-test-wheelhouse
      - name: "Phase: static AST / discrimination floors"
        id: static
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          echo "static_floors phase=job status=start"
          chmod +x tools/run_static_sole_construction_floors.sh
          set +e
          bash tools/run_static_sole_construction_floors.sh
          code=$?
          set -e
          echo "static_floors phase=mint_report exit=$code"
          mint_args=(
            --mint-report floor-axis-report.json
            --axis-id static-laws
            --display R_static_sole_construction
            --kind static
            --commit-sha "${GITHUB_SHA}"
            --exit-code "$code"
          )
          if [ "$code" -ge 2 ]; then
            mint_args+=(--no-scan-completed --unmeasured-reason "static floors exit=${code} (crash — not residual)")
          elif [ -s floor-static-residual.json ]; then
            mint_args+=(--residual-from-summary floor-static-residual.json)
          else
            mint_args+=(--no-scan-completed --unmeasured-reason "static residual summary missing after exit=${code}")
          fi
          python3 -u tools/sole_construction_floor_enrollment.py "${mint_args[@]}"
          exit "$code"
      - name: Upload static axis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floor-axis-static-laws
          path: floor-axis-report.json
          if-no-files-found: error

  floor-enrollment:
    name: floor-enrollment
    needs: [python-test-env-prepare, process-floor, static-floors]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download shared third-party wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ runner.temp }}/python-test-wheelhouse
      - name: Install declared environment from shared wheelhouse
        id: floor-enrollment-env
        uses: ./.github/actions/python-test-environment-from-wheelhouse
        with:
          wheelhouse-path: ${{ runner.temp }}/python-test-wheelhouse
      - name: "Phase: download axis reports"
        uses: actions/download-artifact@v4
        with:
          path: floor-axis-artifacts
          pattern: floor-axis-*
          merge-multiple: false
      - name: "Phase: enrollment roll call (missing = UNMEASURED)"
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "floor_enrollment phase=job status=start commit=$GITHUB_SHA"
          "${{ steps.floor-enrollment-env.outputs.python }}" -u tools/sole_construction_floor_enrollment.py \
            --check-attendance floor-axis-artifacts \
            --require-commit "${GITHUB_SHA}" \
            --write-campaign-body floor-measurement.json \
            --partial-json floor-axis-artifacts/enrollment-partial.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail attendance if incomplete (tool exit already).
          # Also fail if any residual-red axis attended: residual red is campaign red.
          "${{ steps.floor-enrollment-env.outputs.python }}" -u - <<'PY'
          import json, sys
          from pathlib import Path
          body = json.loads(Path("floor-measurement.json").read_text())
          enr = body.get("enrollment") or {}
          print(
              f"floor_enrollment phase=campaign_gate "
              f"status={enr.get('status')} attended={enr.get('attended')} "
              f"missing={enr.get('missing')} residual={enr.get('residualRed')}",
              flush=True,
          )
          if enr.get("status") != "complete":
              print("UNMEASURED: enrollment incomplete", enr, file=sys.stderr, flush=True)
              sys.exit(1)
          residual = enr.get("residualRed") or []
          if residual:
              print(f"RESIDUAL RED axes: {residual}", file=sys.stderr, flush=True)
              sys.exit(1)
          print("enrollment complete; all axes residual-green", flush=True)
          PY
      - name: Upload campaign measurement body
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sole-construction-floors-measurement
          path: |
            floor-measurement.json
            floor-axis-artifacts/enrollment-partial.json
            floor-axis-artifacts/attendance-partial.json
          if-no-files-found: error
