name: Factory zero tolerance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-zero-tolerance:
    name: factory-zero-tolerance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate factory behavior-construction side doors
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_zero_tolerance.py
