name: Python sole-construction floors (R>0 red)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sole-construction-floors:
    name: python-sole-construction-floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Permanent floors — baseline-free. R > 0 ⇒ CI red on every axis.
      # See docs/contributing/python-sole-construction.md
      - name: R_behavior_side_doors = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_zero_tolerance.py
      - name: R_ownership = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_ownership_law.py
      - name: R_factory_panic_catches_outside_audit = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_panic_catch_law.py
      - name: Install Python lift kit and static-floor test runner
        if: always()
        run: >-
          python -m pip install
          pytest
          ./implementations/python/sugar-lift-python-source
          ./implementations/python/sugar-lift-py-tests
      - name: R_vendor_special_case discrimination
        if: always()
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_vendor_special_case_law.py
          -q
      - name: R_vendor_special_case = 0
        if: always()
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/vendor_special_case_law.py
      - name: R_silent discrimination
        if: always()
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_silent_zero_tolerance.py
          -q
      - name: R_silent = 0
        if: always()
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/silent_zero_tolerance.py
      # Product-completeness axis (#5252). R_silent does not subsume unclassified.
      # Discrimination proves the instrument trips on planted residue and refuses
      # missing measurement (never fakes R=0). Live corpus R is measured by
      # recensus shards and gated via:
      #   scripts/factory_walk_unclassified_law.py --from-json <shard>
      - name: R_factory_walk_unclassified discrimination
        if: always()
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_factory_walk_unclassified_law.py
          -q
