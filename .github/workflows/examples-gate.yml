name: Examples Gate

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: examples-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  examples-gate:
    name: examples smoke gate
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reuse or seed the commit's Rust build
        uses: ./.github/actions/setup-rust-cache
        with:
          mode: seed

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps (z3, maven, vampire)
        run: |
          tools/ci-apt-install.sh z3 maven unzip b3sum
          curl -fsSL -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
          unzip -o -q /tmp/vampire.zip -d /tmp/vampire-bin
          sudo install -m 0755 /tmp/vampire-bin/vampire /usr/local/bin/vampire
          vampire --version | head -1 || true

      - name: Run examples smoke gate
        run: make examples-gate
        env:
          CI: '1'
          USE_BCARGO: '0'
