name: Python package suite (authoritative)

# THE DEFECT THIS FIXES
#
# One cold pytest over ~3864 tests is one process on one core while peers idle.
# That serialization starved every measurement for hours. Fan-out is correct.
#
# SIZING (measured, not guessed): 32 shards made pytest work ~25s mean / ~71s
# max, but paid 89–156s env prep PER JOB and stampeded cold sugarbin. Setup
# dominated work. Eight shards keep the sweep in minutes and cut the env tax
# and stampede fourfold. Not a retreat from parallelism — right-size to the box.
#
# SHARED ENV: the python-test-environment wheelhouse is IDENTICAL across shards.
# Prepare it once, upload the third-party wheelhouse + tip identity, shards
# install --no-index (same shape as showcase #7020). First-party still binds
# from each job's checkout via PYTHONPATH (never site-packages).
#
# DESIGN: 8 deterministic file shards. Each job writes its OWN identity-bound
# suite-report.json. Completeness is ENROLLMENT (roster + roll call), not merge
# into a shared hub. Identity gate runs PER SHARD.
#
# Shard count k=8 lives in tools/python_package_suite_shards.py.
# Split key is LPT on a content-addressed per-file cost prior (not
# path-index%8). Live by-count k=8 showed 1115s vs 45s shards; LPT
# targets T/k. No prior → equal-count + JOB_LOG; run writes prior.
# Shard count lives in tools/python_package_suite_shards.py (SHARD_COUNT=8)
# and is mirrored as the static matrix + SUITE_SHARD_COUNT env below.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      discrimination:
        description: Also run the reversed/shuffled discrimination arms.
        type: boolean
        default: false

permissions:
  contents: read

# NO concurrency group — every run retained.

jobs:
  identity-gate-twins:
    name: identity gate teeth (both faces)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Both faces of every identity tooth
        shell: bash
        run: python3 tests/test_python_suite_identity_gate_twins.py

  # ONE env prep for the whole suite matrix. Shards need: prepare (not a
  # roster emit — matrix is static). They never re-run the full builder.
  python-test-env-prepare:
    name: python test env (shared wheelhouse + identity)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    outputs:
      identity-hash: ${{ steps.env.outputs.identity-hash }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare immutable Python test environment (once)
        id: env
        uses: ./.github/actions/python-test-environment
        with:
          identity-artifact: "false"
      - name: Upload third-party wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ steps.env.outputs.env-dir }}/wheelhouse/
          if-no-files-found: error
      - name: Upload tip environment identity
        uses: actions/upload-artifact@v4
        with:
          name: python-test-environment-identity
          path: ${{ steps.env.outputs.identity-path }}
          if-no-files-found: error

  # One CI job per shard. Own report. Own identity gate. No singleton writer.
  python-package-suite:
    name: suite canonical shard ${{ matrix.shard }}
    needs: [python-test-env-prepare]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      # Single source of truth for enrollment roll call; keep == SHARD_COUNT.
      SUITE_SHARD_COUNT: "8"
    steps:
      - uses: actions/checkout@v6

      - name: Download shared third-party wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ runner.temp }}/python-test-wheelhouse

      - name: Download tip environment identity
        uses: actions/download-artifact@v4
        with:
          name: python-test-environment-identity
          path: ${{ runner.temp }}/python-test-identity


      - name: Resolve LPT file-cost prior path
        id: lpt
        shell: bash
        run: |
          set -euo pipefail
          dir="${GITHUB_WORKSPACE}/.cache/sugar/lpt-file-costs"
          mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "SUGAR_LPT_PRIOR_DIR=$dir" >> "$GITHUB_ENV"
          echo "JOB_LOG phase=lpt-prior status=resolve dir=$dir"
      - name: Restore LPT file-cost prior (content-addressed)
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lpt.outputs.dir }}
          key: lpt-file-costs-${{ github.sha }}
          restore-keys: |
            lpt-file-costs-
      - name: Install from shared wheelhouse (no network resolve)
        id: env
        uses: ./.github/actions/python-test-environment-from-wheelhouse
        with:
          wheelhouse-path: ${{ runner.temp }}/python-test-wheelhouse
          identity-path: ${{ runner.temp }}/python-test-identity/environment-identity.json

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache

      - name: Resolve the sugar binary and read its source identity
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          sugar_bin="$(bin/sugarbin --profile release)"
          echo "SUGAR_BIN=$sugar_bin" >> "$GITHUB_ENV"
          manifest="$sugar_bin.sugarbin.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::resolved binary $sugar_bin has no $manifest"
            exit 1
          fi
          stamp="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceStamp"])' "$manifest")"
          case "$stamp" in
            blake3-512_*) ;;
            *) echo "::error::binary manifest sourceStamp is malformed: $stamp"; exit 1 ;;
          esac
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Shard ${{ matrix.shard }} sweep (own identity-bound report)
        id: sweep
        shell: bash
        working-directory: implementations/python
        env:
          PYTHONPATH: ${{ github.workspace }}/tools:${{ env.SUGAR_CHECKOUT_PYTHONPATH }}
          SUITE_IDENTITY_PATH: ${{ steps.env.outputs.identity-path }}
          SUITE_BINARY_STAMP: ${{ steps.binary.outputs.stamp }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ env.SUITE_SHARD_COUNT }}
        run: |
          set -uo pipefail
          mapfile -t paths < <(
            python3 "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
              --repo-root "$GITHUB_WORKSPACE" \
              --shard-count "$SHARD_COUNT" \
              --shard-index "$SHARD" \
              --emit-paths-for-cwd
          )
          echo "shard $SHARD / $SHARD_COUNT paths (${#paths[@]}):"
          printf '  %s\n' "${paths[@]:-}"
          if [ "${#paths[@]}" -eq 0 ]; then
            python3 "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
              --shard-count "$SHARD_COUNT" \
              --shard-index "$SHARD" \
              --mint-empty-report "$GITHUB_WORKSPACE/suite-report.json" \
              --suite-identity "$SUITE_IDENTITY_PATH" \
              --suite-commit "$GITHUB_SHA" \
              --suite-binary-stamp "$SUITE_BINARY_STAMP" \
              --suite-order canonical
            echo "empty shard $SHARD" | tee "$GITHUB_WORKSPACE/suite.log"
            echo "pytest_exit=0" >> "$GITHUB_OUTPUT"
          else
            set +e
            python -m pytest "${paths[@]}" -q \
              -p no:cacheprovider -p no:randomly \
              -p python_package_suite_report \
              --suite-report="$GITHUB_WORKSPACE/suite-report.json" \
              --suite-identity="$SUITE_IDENTITY_PATH" \
              --suite-commit="$GITHUB_SHA" \
              --suite-binary-stamp="$SUITE_BINARY_STAMP" \
              --suite-order=canonical \
              --suite-shard-index="$SHARD" \
              --suite-shard-count="$SHARD_COUNT" \
              --suite-label="python-package-suite-canonical-shard-$(printf '%02d' "$SHARD")" \
              2>&1 | tee "$GITHUB_WORKSPACE/suite.log"
            pytest_exit="${PIPESTATUS[0]}"
            set -e
            echo "pytest_exit=$pytest_exit" >> "$GITHUB_OUTPUT"
          fi
          test -s "$GITHUB_WORKSPACE/suite.log"
          test -s "$GITHUB_WORKSPACE/suite-report.json"
          # Attendance marker for heavy roll call (measurementClass).
          python3 -c "
          import json, os
          from pathlib import Path
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'suite-report.json'
          body = json.loads(p.read_text())
          body['measurementClass'] = 'python-package-suite'
          p.write_text(json.dumps(body, indent=2) + '\n')
          "

      - name: Publish the node-ID vector
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python tools/python_package_suite_summary.py \
            --report suite-report.json \
            --pytest-exit '${{ steps.sweep.outputs.pytest_exit }}' \
            --node-id-dir suite-node-ids \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Identity gate (per-shard R_identity = 0)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/python_suite_identity_gate.py \
            --report suite-report.json \
            --require-commit "$GITHUB_SHA" \
            | tee identity-gate.md \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload authoritative shard artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-package-suite-canonical-shard-${{ matrix.shard }}
          path: |
            suite.log
            suite-report.json
            suite-node-ids/
            identity-gate.md
          if-no-files-found: error

      - name: Upload provisional (identity-unresolved) shard artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-package-suite-canonical-shard-${{ matrix.shard }}-PROVISIONAL-identity-unresolved
          path: |
            suite.log
            suite-report.json
            suite-node-ids/
            identity-gate.md
          if-no-files-found: warn


      - name: Save LPT file-cost prior (content-addressed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lpt.outputs.dir }}
          key: lpt-file-costs-${{ github.sha }}-suite-${{ matrix.shard }}

      - name: Report, do not gate on pytest verdict
        if: always()
        shell: bash
        run: |
          echo "pytest exit ${{ steps.sweep.outputs.pytest_exit }} recorded as evidence."
          echo "Identity + enrollment gate completeness; verdicts do not gate merges."

  # Completeness: all shards attended. Missing shard = UNMEASURED. No merge.
  python-package-suite-attendance:
    name: suite shard enrollment (all attended)
    if: always() && !cancelled()
    needs: [python-package-suite]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      SUITE_SHARD_COUNT: "8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-suite-canonical-shard-*
          path: runs
      - name: Roll call — enrollment is existence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/python_package_suite_shard_attendance.py \
            --reports-dir runs \
            --shard-count "${{ env.SUITE_SHARD_COUNT }}" \
            --require-commit "$GITHUB_SHA" \
            --order canonical \
            | tee -a "$GITHUB_STEP_SUMMARY"

  python-package-suite-discrimination:
    name: suite ${{ matrix.order }} shard ${{ matrix.shard }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.discrimination)
    needs: [python-test-env-prepare]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        order: [reversed, shuffled]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SUITE_SHARD_COUNT: "8"
    steps:
      - uses: actions/checkout@v6
      - name: Download shared third-party wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: python-test-wheelhouse
          path: ${{ runner.temp }}/python-test-wheelhouse
      - name: Download tip environment identity
        uses: actions/download-artifact@v4
        with:
          name: python-test-environment-identity
          path: ${{ runner.temp }}/python-test-identity
      - name: Install from shared wheelhouse (no network resolve)
        id: env
        uses: ./.github/actions/python-test-environment-from-wheelhouse
        with:
          wheelhouse-path: ${{ runner.temp }}/python-test-wheelhouse
          identity-path: ${{ runner.temp }}/python-test-identity/environment-identity.json
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache
      - name: Resolve the sugar binary and read its source identity
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          sugar_bin="$(bin/sugarbin --profile release)"
          echo "SUGAR_BIN=$sugar_bin" >> "$GITHUB_ENV"
          manifest="$sugar_bin.sugarbin.json"
          stamp="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceStamp"])' "$manifest")"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Shard sweep (${{ matrix.order }})
        shell: bash
        working-directory: implementations/python
        env:
          PYTHONPATH: ${{ github.workspace }}/tools:${{ env.SUGAR_CHECKOUT_PYTHONPATH }}
          SUITE_IDENTITY_PATH: ${{ steps.env.outputs.identity-path }}
          SUITE_BINARY_STAMP: ${{ steps.binary.outputs.stamp }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ env.SUITE_SHARD_COUNT }}
          SUITE_ORDER: ${{ matrix.order }}
        run: |
          set -uo pipefail
          mapfile -t paths < <(
            python3 "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
              --repo-root "$GITHUB_WORKSPACE" \
              --shard-count "$SHARD_COUNT" \
              --shard-index "$SHARD" \
              --emit-paths-for-cwd
          )
          if [ "${#paths[@]}" -eq 0 ]; then
            python3 "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
              --shard-count "$SHARD_COUNT" \
              --shard-index "$SHARD" \
              --mint-empty-report "$GITHUB_WORKSPACE/suite-report.json" \
              --suite-identity "$SUITE_IDENTITY_PATH" \
              --suite-commit "$GITHUB_SHA" \
              --suite-binary-stamp "$SUITE_BINARY_STAMP" \
              --suite-order "$SUITE_ORDER"
            echo "empty shard $SHARD ($SUITE_ORDER)" | tee "$GITHUB_WORKSPACE/suite.log"
          else
            set +e
            python -m pytest "${paths[@]}" -q \
              -p no:cacheprovider -p no:randomly \
              -p python_package_suite_report \
              --suite-report="$GITHUB_WORKSPACE/suite-report.json" \
              --suite-identity="$SUITE_IDENTITY_PATH" \
              --suite-commit="$GITHUB_SHA" \
              --suite-binary-stamp="$SUITE_BINARY_STAMP" \
              --suite-order="$SUITE_ORDER" \
              --suite-shuffle-seed="$GITHUB_RUN_ID" \
              --suite-shard-index="$SHARD" \
              --suite-shard-count="$SHARD_COUNT" \
              --suite-label="python-package-suite-${SUITE_ORDER}-shard-$(printf '%02d' "$SHARD")" \
              2>&1 | tee "$GITHUB_WORKSPACE/suite.log"
            set -e
          fi
          test -s "$GITHUB_WORKSPACE/suite-report.json"
      - name: Identity gate (per-shard)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/python_suite_identity_gate.py \
            --report suite-report.json \
            --require-commit "$GITHUB_SHA" \
            | tee identity-gate.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload discrimination shard artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-package-suite-${{ matrix.order }}-shard-${{ matrix.shard }}
          path: |
            suite.log
            suite-report.json
            identity-gate.md
          if-no-files-found: error

  discrimination-verdict:
    name: identical within-shard verdict sets across orders
    if: >-
      always() && !cancelled() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.discrimination)
      )
    needs:
      - python-package-suite
      - python-package-suite-discrimination
    env:
      SUITE_SHARD_COUNT: "8"
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-suite-*-shard-*
          path: runs
      - name: Enrollment for each order
        shell: bash
        run: |
          set -euo pipefail
          count="${{ env.SUITE_SHARD_COUNT }}"
          for order in canonical reversed shuffled; do
            python3 tools/python_package_suite_shard_attendance.py \
              --reports-dir runs \
              --shard-count "$count" \
              --require-commit "$GITHUB_SHA" \
              --order "$order" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Within-shard order-independence (no merged hub)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from python_package_suite_shard_attendance import find_shard_reports
          from python_suite_discrimination import compare

          runs = Path("runs")
          count = int("${{ env.SUITE_SHARD_COUNT }}")
          by_order = {
              order: find_shard_reports(runs, order)
              for order in ("canonical", "reversed", "shuffled")
          }
          crimes = []
          for i in range(count):
              if i not in by_order["canonical"]:
                  crimes.append(f"shard {i:02d}: canonical missing")
                  continue
              _, baseline = by_order["canonical"][i]
              for order in ("reversed", "shuffled"):
                  if i not in by_order[order]:
                      crimes.append(f"shard {i:02d}: {order} missing")
                      continue
                  _, candidate = by_order[order][i]
                  for line in compare(baseline, candidate):
                      crimes.append(f"shard {i:02d}: {line}")
          if crimes:
              print("### discrimination: DIVERGENT or incomplete\n")
              for c in crimes:
                  print(f"- `{c}`")
                  print(f"::error::{c}", file=sys.stderr)
              sys.exit(1)
          print(
              f"### discrimination: identical verdict sets within each of "
              f"{count} shards (no shared aggregate)"
          )
          PY
