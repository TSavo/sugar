name: Main scorecard board

# WHY THIS EXISTS
#
# The pandas board is the slowest number on the main scorecard. As a job of
# main-scorecard.yml it held that workflow's concurrency group until it
# finished (over an hour while the board is slow), so the suite, twins and
# federation numbers were posted once per board run instead of once per merge.
#
# This workflow is the board alone, in its own concurrency groups (below),
# and main-scorecard.yml posts its own row on every merge without waiting
# for it. The board row is posted
# on the same "Main scorecard" issue by tools/main_scorecard_post.py;
# SCORECARD_MEASURES names the board and the nine-step lane (below) as this
# workflow's numbers, so the other numbers are written `-` in a board row and
# are never compared there.
# The board number is compared with the newest earlier row that measured the
# board, and REGRESSION: turns the job red.
#
# The persistent venv and `set +e` are as described in main-scorecard.yml.
# Every seat measures every file of its slice: nothing is carried from an
# earlier run (the carry recorder is gone, #8416; see main-scorecard.yml).
#
# The hourly run has its own group and a gate, as in main-scorecard.yml
# ("THE HOUR NEVER REPLACES A PUSH", #8416): it never replaces the push run
# waiting for the same head, and it measures nothing when a board run on the
# head is queued or measuring or already posted its row.
#
# THE FAST LANE FIRST; SUPERSEDED BOARDS ARE CANCELLED (#8416, 2026-11-16)
#
# The board (one runner for ~20 minutes) and main-scorecard.yml share three
# self-hosted runners, and the board often took one first, so the suite
# shards queued behind it. The `wait` job (a GitHub-hosted runner,
# tools/main_scorecard_wait_fast_lane.sh) now holds the board until
# main-scorecard.yml's run on the same commit has finished: the fast lane is
# the measurement that gates work. The concurrency group is per commit, and
# the `supersede` job (tools/main_scorecard_supersede.sh) cancels every older
# board run on main whose commit is not this run's, waiting or measuring, so
# a merge burst measures the board of its head, not of its first commit.
#
# THE NINE-STEP LANE (`lift`, #8416)
#
# The board builds trees (roll_call.discharge calls .sugar(), never
# .desugar()), so `board=1421/1421 cpanic=0` cannot say how much of pandas
# goes through the nine steps (docs/path-forward.md). The `lift` seats put
# every pinned pandas file through `sugar mint` and `sugar prove`, the
# commands the solver twins and examples/python-base64-federation/run.sh use,
# with tools/nine_step_lift_lane.py: LIFT_SEATS seats of --slice i/K after
# the fast lane, on the same resolved and pin-gated corpus as the board. The
# `lift join` job joins the seats' rows, uploads the compact refusal list
# (`pandas-lift-refusals`, names + file:line, small JSON, so a fix agent never
# needs the board's artifact) and posts `pandas_lift_files= pandas_lift_funcs=
# pandas_refused= pandas_lift_ierr= pandas_lift_missing=` plus the top refusal
# names on the same row (main_scorecard_post.py --lane). SCORECARD_MEASURES
# names both numbers and SCORECARD_LANES names `pandas`; the board posts
# without --final (the lane is pending until the join) and the join posts
# --final, so a number that never reported is unmeasured and compared. A lost
# seat is the lane unmeasured, never a partial count.
#
# ONE SEAT, FILES IN PARALLEL (run 43960179946: 3 seats x 3 h, 822 of 1421
# files without a row). The three self-hosted runners share one 32-thread
# host, so more seats add no CPU: they only take the runners the board and the
# numpy lane need (seat 2 waited 13 min behind the board; the numpy lane
# waited 3 h behind the seats). The lane is now one seat (one runner) running
# LIFT_WORKERS files at once, slowest first by the previous run's rows (order
# only, no row carried), each file inside the one 300 s ceiling, and no file
# starts once it could not finish inside LIFT_SEAT_CAP_S. Its rows live
# under $HOME/.cache/sugar-lift-lane/<run id>, so a re-run of a failed seat
# on the same runner resumes; a new run measures every file.
#
# CROSS-MODULE EDGES BIND. The seat mints every module first, then proves
# each with the same-corpus proofs that answer its calls staged in
# .sugar/imports/ (as examples/python-base64-federation/run.sh stages the
# vendor's), so a call into another pandas module joins that module's
# contract at step 9. The join posts `pandas_edges: corpus=bound/total ...`
# and uploads every corpus edge that did not bind, by reason, beside the
# refusals (`edge-misses.json`). Calls leaving pandas, or into its compiled
# modules, stay unbound and are counted as boundary edges, never misses.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: main-scorecard-board-${{ github.sha }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  BOARD_SEATS: "4"
  # Per-seat and join caps for the pandas board (seconds).
  BOARD_SEAT_CAP_S: "10800"
  BOARD_JOIN_CAP_S: "300"
  # The nine-step lane: seats, files at once per seat, and the budget of one
  # seat (seconds; no file starts once it could not finish inside it). The
  # per-file ceiling is the lane script's own (300 s). The 1-minute load gate
  # in the script (1.25 x CPUs) shares the host with the board and numpy.
  LIFT_SEATS: "1"
  LIFT_WORKERS: "28"
  LIFT_SEAT_CAP_S: "5400"
  # After prove, up to this many files whose mint stalled are minted once
  # more with the kit's stack sampler on (instrument only: no row changes);
  # the aggregates upload as pandas-lift-kit-profiles-<seat>.
  LIFT_PROFILE_TIMEOUTS: "24"
  SCORECARD_ISSUE_TITLE: "Main scorecard"
  SCORECARD_MEASURES: "board,lift"
  # The lanes this workflow posts (main_scorecard_post.py --lane).
  SCORECARD_LANES: "pandas"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Every older board run on main whose commit is not this run's.
  supersede:
    name: cancel superseded runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_supersede.sh
          sparse-checkout-cone-mode: false
      - name: Cancel older runs on other commits
        shell: bash
        run: bash tools/main_scorecard_supersede.sh main-scorecard-board.yml

  # Scheduled runs only: measure=false when this head is already queued,
  # measuring or posted. Skipped on push and dispatch, where the board runs.
  # A gate that fails leaves measure empty, so the board measures.
  gate:
    name: schedule gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.gate.outputs.measure }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_schedule_gate.sh
          sparse-checkout-cone-mode: false
      - name: Does this head still need a row?
        id: gate
        shell: bash
        run: bash tools/main_scorecard_schedule_gate.sh main-scorecard-board.yml

  # Holds the board until main-scorecard.yml's run on this commit finished.
  # measure=false only when every such run was cancelled (superseded). A wait
  # that fails leaves measure empty, so the board measures.
  wait:
    name: wait for the fast lane
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      measure: ${{ steps.wait.outputs.measure }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_wait_fast_lane.sh
          sparse-checkout-cone-mode: false
      - name: Wait until the fast lane on this commit finished
        id: wait
        shell: bash
        run: bash tools/main_scorecard_wait_fast_lane.sh

  # The pass kit's shape (run.sh): BOARD_SEATS seats of --slice i/K, each with
  # its own checkpoint, joined, then --aggregate-only. pandas is pinned to 3.0.3 by
  # sugar-lift-py-tests[test] and docs/ledgers/pins/pandas-3.0.3.pin.json.
  board:
    name: pandas board
    needs: [gate, wait]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' && needs.wait.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache
      - name: Resolve authenticated pandas corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$(
            python -c 'from sugar_lift_py_tests.authenticated_pytest import authenticated_pandas_corpus; print(authenticated_pandas_corpus().root)'
          )"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "pandas corpus: $root"
      - name: Corpus pin gate (pandas 3.0.3)
        shell: bash
        env:
          PANDAS_CORPUS: ${{ steps.corpus.outputs.root }}
        run: |
          set -euo pipefail
          python tools/bx_corpus_pin_gate.py \
            --expected-pin docs/ledgers/pins/pandas-3.0.3.pin.json \
            --corpus-root "$PANDAS_CORPUS"
      - name: Seats + join + aggregate
        shell: bash
        working-directory: implementations/python/sugar-lift-py-tests
        env:
          PANDAS_CORPUS: ${{ steps.corpus.outputs.root }}
        run: |
          set +e -uo pipefail
          export SUGAR_HOME="$GITHUB_WORKSPACE/.sugar"
          OUT="$GITHUB_WORKSPACE/board"
          rm -rf "$OUT"
          mkdir -p "$OUT/join"
          K="$BOARD_SEATS"
          for i in $(seq 0 $((K - 1))); do
            (
              timeout -s KILL "$BOARD_SEAT_CAP_S" \
                python -u scripts/control_effect_recensus.py "$PANDAS_CORPUS" \
                  --corpus-root "$PANDAS_CORPUS" \
                  --slice "$i/$K" \
                  --out-dir "$OUT/s$i" \
                  > "$OUT/s$i.log" 2>&1
              echo $? > "$OUT/s$i.rc"
            ) &
          done
          wait
          for i in $(seq 0 $((K - 1))); do
            echo "seat s$i rc=$(cat "$OUT/s$i.rc" 2>/dev/null || echo missing)"
          done
          cat "$OUT"/s*/checkpoint.jsonl > "$OUT/join/checkpoint.jsonl" 2>/dev/null
          timeout -s KILL "$BOARD_JOIN_CAP_S" \
            python -u scripts/control_effect_recensus.py "$PANDAS_CORPUS" \
              --corpus-root "$PANDAS_CORPUS" \
              --aggregate-only \
              --out-dir "$OUT/join" \
              > "$OUT/join.log" 2>&1
          echo "join rc=$?"
          grep -a -e 'RECENSUS DONE' -e 'RECENSUS PARTIAL files=' "$OUT/join.log" \
            || echo "no RECENSUS DONE or RECENSUS PARTIAL line"
      - name: Post the board number
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          # The sealed board's line; when compose refused the board, the line
          # naming the files that did reach a terminal and how many files the
          # instrument failed on (control_effect_recensus._partial_line).
          line="$(grep -a 'RECENSUS DONE' board/join.log 2>/dev/null | tail -n 1 | tr -d '\r')"
          partial=""
          if [ -z "$line" ]; then
            line="$(grep -a 'RECENSUS PARTIAL files=' board/join.log 2>/dev/null | tail -n 1 | tr -d '\r')"
            [ -n "$line" ] && partial=1
          fi
          completed="$(printf '%s' "$line" | sed -n 's/.*files=\([0-9]*\)\/\([0-9]*\).*/\1/p')"
          total="$(printf '%s' "$line" | sed -n 's/.*files=\([0-9]*\)\/\([0-9]*\).*/\2/p')"
          cpanic="$(printf '%s' "$line" | sed -n 's/.*cpanic=\([0-9]*\).*/\1/p')"
          failures="$(printf '%s' "$line" | sed -n 's/.*instrument_failures=\([0-9]*\).*/\1/p')"
          partial_args=()
          if [ -n "$partial" ]; then
            partial_args=(--set "board.instrument_failures=${failures:-?}" \
              --set "board.note=partial: compose refused the board; ${failures:-?} files failed the instrument and are not counted")
          fi
          echo "board completed=$completed total=$total cpanic=$cpanic instrument_failures=${failures:-0} partial=${partial:-0}"
          # Not --final: the lift lane's number is still pending; the lift
          # join posts the final row.
          if [ -n "$completed" ] && [ -n "$total" ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set "board.completed=$completed" --set "board.total=$total" \
              --set "board.cpanic=${cpanic:-?}" \
              --set "board.line=$(printf '%s' "$line" | cut -c1-300)" \
              "${partial_args[@]}"
          else
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set board.measured=false --set "board.note=no RECENSUS DONE or RECENSUS PARTIAL line"
          fi
      - name: Upload board logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-board
          path: |
            board/*.log
            board/*.rc
            board/join/**
          if-no-files-found: warn
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # The nine-step lane: every pinned pandas file through `sugar mint` and
  # `sugar prove` (tools/nine_step_lift_lane.py), seat i of LIFT_SEATS
  # (--slice i/K), on the board's resolved and pin-gated corpus.
  lift:
    name: pandas lift seat ${{ matrix.seat }}
    needs: [gate, wait]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' && needs.wait.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    # Set-up, LIFT_SEAT_CAP_S (90 min), and the upload.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One entry per seat; keep in step with LIFT_SEATS.
        seat: [0]
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache
      - name: Install z3 (cached on the runner)
        shell: bash
        run: tools/ci-apt-install.sh z3
      - name: Resolve authenticated pandas corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$(
            python -c 'from sugar_lift_py_tests.authenticated_pytest import authenticated_pandas_corpus; print(authenticated_pandas_corpus().root)'
          )"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "pandas corpus: $root"
      - name: Corpus pin gate (pandas 3.0.3)
        shell: bash
        env:
          PANDAS_CORPUS: ${{ steps.corpus.outputs.root }}
        run: |
          set -euo pipefail
          python tools/bx_corpus_pin_gate.py \
            --expected-pin docs/ledgers/pins/pandas-3.0.3.pin.json \
            --corpus-root "$PANDAS_CORPUS"
      - name: Timing prior (an earlier run's rows; order only)
        shell: bash
        run: |
          set +e -uo pipefail
          # The newest earlier board run with seat rows orders this run's
          # files slowest first. Nothing from it is counted or carried.
          mkdir -p lift-prior
          for id in $(gh run list --workflow main-scorecard-board.yml --branch main \
                        --limit 10 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --pattern 'pandas-lift-seat-*' \
                 --dir "lift-prior/$id" >/dev/null 2>&1; then
              echo "timing prior: run $id, $(cat lift-prior/"$id"/*/*/rows.jsonl 2>/dev/null | wc -l) rows"
              break
            fi
            rm -rf "lift-prior/$id"
          done
          true
      - name: Seat (sugar mint per file, then sugar prove with its imports)
        shell: bash
        env:
          PANDAS_CORPUS: ${{ steps.corpus.outputs.root }}
          SEAT: ${{ matrix.seat }}
        run: |
          set +e -uo pipefail
          # Rows live outside the workspace, keyed by this run: a re-run of
          # this seat (same run, next attempt) on this runner resumes from
          # them; a new run measures every file. State older than a day goes.
          STATE_BASE="$HOME/.cache/sugar-lift-lane"
          STATE="$STATE_BASE/$GITHUB_RUN_ID/pandas-s$SEAT"
          mkdir -p "$STATE"
          touch -d '-1 day' "$STATE_BASE/.prune-before"
          for d in "$STATE_BASE"/*/; do
            [ "$d" -ot "$STATE_BASE/.prune-before" ] && rm -rf "$d"
          done
          OUT="$GITHUB_WORKSPACE/lift"
          rm -rf "$OUT"
          mkdir -p "$OUT/s$SEAT"
          # The script stops starting files in time to finish inside
          # LIFT_SEAT_CAP_S; the KILL is only the backstop.
          timeout -s KILL "$((LIFT_SEAT_CAP_S + 300))" \
            python -u tools/nine_step_lift_lane.py \
              --corpus-root "$PANDAS_CORPUS" \
              --label pandas \
              --slice "$SEAT/$LIFT_SEATS" \
              --out-dir "$STATE" \
              --workers "$LIFT_WORKERS" \
              --seat-budget "$LIFT_SEAT_CAP_S" \
              --prior lift-prior \
              --profile-timeouts "$LIFT_PROFILE_TIMEOUTS" \
              > "$OUT/s$SEAT.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/s$SEAT.rc"
          # The per-file projects and the proof store are scratch (the store
          # is a few GB of .proof files, one run an hour): only the rows travel.
          rm -rf "$STATE/work" "$STATE/store"
          cp "$STATE/rows.jsonl" "$OUT/s$SEAT/rows.jsonl"
          # The stalled files' kit stack profiles (small aggregates): their
          # own artifact, so the timing prior and the join never read them.
          mkdir -p "$GITHUB_WORKSPACE/lift-profiles/s$SEAT"
          [ -f "$STATE/profiles.jsonl" ] && cp "$STATE/profiles.jsonl" "$GITHUB_WORKSPACE/lift-profiles/s$SEAT/"
          [ -d "$STATE/profiles" ] && cp -r "$STATE/profiles" "$GITHUB_WORKSPACE/lift-profiles/s$SEAT/"
          grep -E "^\[profile " "$OUT/s$SEAT.log" | tail -n 40
          echo "lift seat s$SEAT rc=$rc wall=$(( $(date +%s) - JOB_T0 ))s"
          grep -E "^pandas seat |^seat budget|^holding|^resuming|^retry" "$OUT/s$SEAT.log" | tail -n 40
          tail -n 5 "$OUT/s$SEAT.log"
      - name: Upload the seat (rows and log only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pandas-lift-seat-${{ matrix.seat }}
          # A re-run attempt replaces the seat's earlier upload.
          overwrite: true
          path: |
            lift/s*/rows.jsonl
            lift/*.log
            lift/*.rc
          if-no-files-found: warn
      - name: Upload the stalled files' kit profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pandas-lift-kit-profiles-${{ matrix.seat }}
          overwrite: true
          path: lift-profiles/
          if-no-files-found: ignore

  # Joins the seats, uploads the compact refusal list, posts the final row.
  lift-join:
    name: lift join
    needs: [gate, wait, board, lift]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' && needs.wait.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Resolve authenticated pandas corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$(
            python -c 'from sugar_lift_py_tests.authenticated_pytest import authenticated_pandas_corpus; print(authenticated_pandas_corpus().root)'
          )"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Download the seats
        uses: actions/download-artifact@v4
        with:
          pattern: pandas-lift-seat-*
          path: seats
      - name: Join
        shell: bash
        env:
          PANDAS_CORPUS: ${{ steps.corpus.outputs.root }}
        run: |
          set +e -uo pipefail
          mkdir -p pandas-lift
          # The enrolled count is the lane's own enumeration (--count), so a
          # file no seat reached is counted missing, never dropped.
          enrolled="$(python tools/nine_step_lift_lane.py --corpus-root "$PANDAS_CORPUS" --count)"
          dirs=()
          missing=()
          for i in $(seq 0 $((LIFT_SEATS - 1))); do
            d="seats/pandas-lift-seat-$i/s$i"
            rc="$(cat "seats/pandas-lift-seat-$i/s$i.rc" 2>/dev/null || echo missing)"
            echo "lift seat s$i rc=$rc"
            if [ -f "$d/rows.jsonl" ]; then dirs+=("$d"); else missing+=("s$i"); fi
          done
          # A lost seat is the lane unmeasured, never a partial count: no
          # summary is written and the poster calls pandas unmeasured.
          if [ "${#missing[@]}" -ne 0 ] || ! [[ "$enrolled" =~ ^[0-9]+$ ]]; then
            echo "lift join refused: seats missing=[${missing[*]}] enrolled=$enrolled"
          else
            python -u tools/nine_step_lift_lane.py --join "${dirs[@]}" \
              --label pandas --enrolled "$enrolled" \
              --out pandas-lift/summary.json --refusals pandas-lift/refusals.json \
              --edge-misses pandas-lift/edge-misses.json \
              > pandas-lift/join.log 2>&1
            echo "join rc=$?"
            cat pandas-lift/join.log
          fi
      - name: Post the lift number (final row)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          # A missing summary is pandas unmeasured (SCORECARD_LANES names it).
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" --final \
            --lane pandas-lift/summary.json
      - name: Upload the compact refusal list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pandas-lift-refusals
          overwrite: true
          path: |
            pandas-lift/refusals.json
            pandas-lift/edge-misses.json
          if-no-files-found: warn
      - name: Upload the lift join
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pandas-lift-join
          overwrite: true
          path: |
            pandas-lift/summary.json
            pandas-lift/join.log
          if-no-files-found: warn
