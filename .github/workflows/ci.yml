# Sugar CI: the acid test
#
# Drop sugar into a project, prove correctness with zero code changes.
#
# WHAT THIS WORKFLOW ACTUALLY RUNS -- read the `jobs:` block, not a slogan.
# It runs `make ${{ matrix.target }}` over the `core` matrix plus sharded
# `make test-showcases`. That is `make ci` decomposed for parallelism:
# check-lift-refusal-vocabulary, check-fleet-claim-contract,
# test-python-format, test-claim-mass-tripwires, test-showcases, self-attest.
# coretests-invariants is NOT on the per-commit path (Rust client not ready;
# do not gate Python commits on a 10+ minute Rust corpus job).
#
# IT DOES NOT RUN `test-rust` OR `test-python`, AND `make ci` DOES NOT EITHER.
# This comment used to claim it did. It was false for both halves, and the
# cost of the lie was concrete: `sugar-lift-py-tests` had no PR-gate coverage
# at all, so the unit tests for `ExitSet.and_exit` did not run against #6270,
# the PR that rewrote that algebra. A comment describing wiring nobody built
# is worse than no comment -- it is a green light with no circuit behind it.
#
# Both suites are deliberately out of `make ci`, and each has a named owner:
#   - `test-rust` / `test-python` are the development frontier, run by
#     `make test-all`. They include intentionally red audits and ratchets;
#     see the `ci:` target's comment in the Makefile.
#   - the Python package suite is measured by
#     .github/workflows/python-package-suite.yml, on every PR and push, as
#     ONE authoritative cold whole-package sweep. It REPORTS -- ~131 known
#     failures are recorded as node-ID evidence, not converted into a gate.
#     Promoting it to a gate is a merge-policy decision and must be made
#     explicitly, by driving those node IDs to zero and then wiring it here.
#
# No federation conformance gate; the Makefile is the contract.
#
# PREPARE SERIALIZATION (deleted): a `shared Rust build` job warmed the
# sugarbin shelf (including `coretests_sweep`, consumed only by Makefile
# coretests-invariants — off this matrix after #7006) and shelf consumers
# `needs:`'d it. #7019 unhooked pure-Python core from that gate. This change
# deletes the prepare JOB itself: self-attest and showcases already call
# bin/sugarbin (consumer is warmer); stamp-keyed single-flight (#7014/#7017)
# dedupes concurrent cold rebuilds. Do not reintroduce a job-level warm that
# nothing requires as a gate.

name: CI

on:
  push:
    branches:
      - main

# NO `concurrency:` BLOCK. `cancel-in-progress: false` is not enough: GitHub
# keeps only ONE pending run per group and replaces a queued run with a newer
# one regardless of that flag. On a merge train into main that silently
# discarded the CI vector of four merged commits (329576c3d, ef19b8175,
# c11767c5e, df408100e). Every commit must retain its own run. Runner
# scheduling provides queuing; GitHub concurrency must not discard evidence.

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  # Tiny, independent. Was buried inside the deleted prepare job.
  ci-apt-fast-path:
    name: ci-apt installed-package fast path
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check apt installed-package fast path
        run: tools/test-ci-apt-install.sh

  # Pure Python / fmt instruments. Never invoke bin/sugarbin.
  # #7019 already removed needs: prepare; they start immediately.
  core:
    name: core (${{ matrix.name }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: refusal vocabulary
            target: check-lift-refusal-vocabulary
            python: false
            z3: false
            b3sum: false
          - name: fleet claim contract
            target: check-fleet-claim-contract
            python: false
            z3: false
            b3sum: false
          # claim-mass + python-format: fan-out jobs below.
          # coretests-invariants and coretests-source-audit are Makefile targets
          # only (hand / future Rust work). Not on this per-commit matrix.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        # cargo fmt needs a toolchain; not a sugar binary shelf warm.
        if: matrix.target == 'check-lift-refusal-vocabulary'
        uses: ./.github/actions/setup-rust-cache

      - name: Check Rust formatting
        if: matrix.target == 'check-lift-refusal-vocabulary'
        working-directory: implementations/rust
        run: cargo fmt --all -- --check

      - name: Set up Python 3.12
        if: matrix.python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        if: matrix.python
        # Sole dep authority: sugar-lift-py-tests[test] (pyproject.toml).
        # Runtime deps (blake3/pynacl/cbor2/tqdm) ride on package dependencies.
        run: |
          python -m pip install --quiet \
            -e 'implementations/python/sugar-lift-py-tests[test]'

      - name: Install source-audit system deps
        if: matrix.z3
        run: tools/ci-apt-install.sh z3 b3sum

      - name: Install sugarbin hashing dependency
        if: matrix.b3sum && !matrix.z3
        run: tools/ci-apt-install.sh b3sum

      - name: Run core instrument
        run: make ${{ matrix.target }}
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}

  # self-attest resolves sugar/sugar-lift via bin/sugarbin (consumer is warmer).
  # No needs: prepare — single-flight covers multi-job cold miss.
  core-shelf:
    name: core (${{ matrix.name }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: self attestation
            target: self-attest
            python: false
            z3: false
            b3sum: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache

      - name: Install sugarbin hashing dependency
        if: matrix.b3sum
        run: tools/ci-apt-install.sh b3sum

      - name: Run core instrument
        run: make ${{ matrix.target }}
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}

      - name: Attest published sugar binary
        if: matrix.target == 'self-attest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: implementations/rust/target/release/sugar

  # Showcase shards warm their own bins inside `make test-showcases`.
  # Concurrent shards share the filesystem shelf; single-flight prevents stampede.
  # ------------------------------------------------------------------
  claim-mass-matrix:
    name: emit claim-mass pin matrix
    # no needs: prepare — pure Python (7019)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v6
      - name: Emit pin matrix from PINS (single source of truth)
        id: m
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 tools/claim_mass_tripwire_shards.py --emit-matrix-json)"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["pin"]))' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  claim-mass-tripwires:
    name: claim-mass (${{ matrix.pin }})
    needs: [claim-mass-matrix]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.claim-mass-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install tripwire deps
        run: |
          python -m pip install --quiet \
            -e implementations/python/sugar-lift-python-source \
            -e implementations/python/sugar-source-tree \
            -e 'implementations/python/sugar-lift-py-tests[test]'
      - name: Run pin ${{ matrix.pin }}
        id: pin
        shell: bash
        working-directory: implementations/python/sugar-lift-py-tests
        env:
          PYTHONPATH: src:tests:${{ github.workspace }}/implementations/python/sugar-lift-python-source/src:${{ github.workspace }}/implementations/python/sugar-source-tree/src
        run: |
          set -uo pipefail
          set +e
          python -m pytest -q tests/test_claim_mass_tripwires.py -k '${{ matrix.pin }}'
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          python3 - <<PY
          import json, os
          from pathlib import Path
          body = {
              "schemaVersion": 1,
              "measurementClass": "claim-mass-tripwires",
              "pin": "${{ matrix.pin }}",
              "measuredCommit": os.environ.get("GITHUB_SHA"),
              "status": "completed",
              "exitCode": $exit_code,
          }
          Path(os.environ["GITHUB_WORKSPACE"], "claim-mass-body.json").write_text(
              json.dumps(body, indent=2) + "\n"
          )
          PY
          exit "$exit_code"
      - name: Upload pin measurement body
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-mass-${{ matrix.pin }}
          path: claim-mass-body.json
          if-no-files-found: error

  claim-mass-attendance:
    name: claim-mass enrollment (all pins)
    if: always() && !cancelled()
    needs: [claim-mass-matrix, claim-mass-tripwires]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: claim-mass-*
          path: runs
      - name: Roll call — every pin attended
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/claim_mass_tripwire_attendance.py \
            --reports-dir runs \
            --require-commit "$GITHUB_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # python-format: N packages ⇒ N black jobs. Enrollment is existence.
  # ------------------------------------------------------------------
  python-format-matrix:
    name: emit python-format package matrix
    # no needs: prepare — pure Python (7019)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 tools/python_format_shards.py --emit-matrix-json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  python-format:
    name: black (${{ matrix.package }})
    needs: [python-format-matrix]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-format-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install black (via sugar-lift-py-tests[test])
        run: |
          python -m pip install --quiet \
            -e 'implementations/python/sugar-lift-py-tests[test]'
      - name: Black check ${{ matrix.package }}
        id: fmt
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m black --check "implementations/python/${{ matrix.package }}"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          python3 - <<PY
          import json, os
          from pathlib import Path
          body = {
              "schemaVersion": 1,
              "measurementClass": "python-format",
              "package": "${{ matrix.package }}",
              "measuredCommit": os.environ.get("GITHUB_SHA"),
              "status": "completed",
              "exitCode": $exit_code,
          }
          Path("python-format-body.json").write_text(json.dumps(body, indent=2) + "\n")
          PY
          exit "$exit_code"
      - name: Upload format measurement body
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-format-${{ matrix.package }}
          path: python-format-body.json
          if-no-files-found: error

  python-format-attendance:
    name: python-format enrollment (all packages)
    if: always() && !cancelled()
    needs: [python-format-matrix, python-format]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: python-format-*
          path: runs
      - name: Roll call — every package attended
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/python_format_attendance.py \
            --reports-dir runs \
            --require-commit "$GITHUB_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  showcases:
    name: showcases (${{ matrix.shard }}/4)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        # Sole dep authority: sugar-lift-py-tests[test] (pyproject.toml).
        run: |
          python -m pip install --quiet \
            -e implementations/python/sugar-build-witness \
            -e 'implementations/python/sugar-lift-py-tests[test]' \
            -e implementations/python/sugar-lift-python-source \
            -e implementations/python/sugar-lift-py-pytest-witness

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps
        run: |
          tools/ci-apt-install.sh z3 cvc5 maven unzip b3sum
          if ! command -v vampire >/dev/null 2>&1; then
            curl -fsSL -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
            unzip -o -q /tmp/vampire.zip -d /tmp/vampire-bin
            sudo install -m 0755 /tmp/vampire-bin/vampire /usr/local/bin/vampire
          fi

      - name: Run showcase shard
        run: make test-showcases
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}
          SHOWCASE_SHARD_COUNT: '4'
          SHOWCASE_SHARD_INDEX: ${{ matrix.shard }}

  acid-test:
    name: acid test (make ci)
    # Aggregate genuine success/failure results, but do not manufacture a red
    # test result when concurrency intentionally supersedes the whole run.
    if: ${{ always() && !cancelled() }}
    needs:
      - ci-apt-fast-path
      - core
      - core-shelf
      - claim-mass-attendance
      - python-format-attendance
      - showcases
    runs-on: ubuntu-latest
    steps:
      - name: Report the complete acid-test vector
        env:
          APT_RESULT: ${{ needs.ci-apt-fast-path.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_SHELF_RESULT: ${{ needs.core-shelf.result }}
          CLAIM_MASS_RESULT: ${{ needs.claim-mass-attendance.result }}
          FORMAT_RESULT: ${{ needs.python-format-attendance.result }}
          SHOWCASE_RESULT: ${{ needs.showcases.result }}
        run: |
          echo "apt=$APT_RESULT core=$CORE_RESULT core-shelf=$CORE_SHELF_RESULT claim-mass=$CLAIM_MASS_RESULT format=$FORMAT_RESULT showcases=$SHOWCASE_RESULT"
          test "$APT_RESULT" = success
          test "$CORE_RESULT" = success
          test "$CORE_SHELF_RESULT" = success
          test "$CLAIM_MASS_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$SHOWCASE_RESULT" = success
