# Sugar CI: the acid test
#
# Drop sugar into a project, prove correctness with zero code changes.
# `make ci` runs the two suites that actually do that: `test-rust` (the rust
# workspace, including the crate-pair inheritance E2E, exercising the ts
# / python realize kits over RPC) and `test-python` (the python kit, including
# the numpy proof). No federation conformance gate; the Makefile is the
# contract.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

jobs:
  prepare:
    name: shared Rust build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Restore and save exact-commit Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}-

      - name: Build shared Rust artifacts once
        run: |
          make build-rust
          cargo build --manifest-path implementations/rust/Cargo.toml \
            -p sugar-ir-compiler-smt-lib --bin sugar-ir-smt-lib \
            -p sugar-ir-compiler-lean --bin sugar-ir-lean \
            -p sugar-ir-compiler-coq --bin sugar-ir-coq \
            -p sugar-ir-compiler-maude --bin sugar-ir-maude \
            -p sugar-walk --bin sugar-walk-rpc \
            -p sugar-lift-rust-tests --bin rust_test_assertions_rpc \
            -p sugar-lift-rust-cargo-test-witness --bin witness_rpc \
            -p sugar-lift-rust-cargo-test-witness --bin discharge_cli

  core:
    name: acid core instruments
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: implementations/rust
        run: cargo fmt --all -- --check

      - name: Restore exact-commit Rust build
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2 pytest
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps (z3, maven, vampire, b3sum)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends z3 maven unzip b3sum
          # Vampire v5.0.1 prebuilt static binary (matches tools/portfolio pin) so the
          # forall-vampire showcase runs in CI for real instead of skipping.
          curl -fsSL -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
          unzip -o -q /tmp/vampire.zip -d /tmp/vampire-bin
          sudo install -m 0755 /tmp/vampire-bin/vampire /usr/local/bin/vampire
          vampire --version | head -1 || true

      - name: Run core instruments
        run: make ci-core
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}

      - name: Attest published sugar binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: implementations/rust/target/release/sugar

  showcases:
    name: showcases (${{ matrix.shard }}/4)
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Restore exact-commit Rust build
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2 pytest

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends z3 maven unzip b3sum
          if ! command -v vampire >/dev/null 2>&1; then
            curl -fsSL -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
            unzip -o -q /tmp/vampire.zip -d /tmp/vampire-bin
            sudo install -m 0755 /tmp/vampire-bin/vampire /usr/local/bin/vampire
          fi

      - name: Run showcase shard
        run: make test-showcases
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}
          SHOWCASE_SHARD_COUNT: '4'
          SHOWCASE_SHARD_INDEX: ${{ matrix.shard }}

  acid-test:
    name: acid test (make ci)
    if: always()
    needs: [prepare, core, showcases]
    runs-on: ubuntu-latest
    steps:
      - name: Report the complete acid-test vector
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CORE_RESULT: ${{ needs.core.result }}
          SHOWCASE_RESULT: ${{ needs.showcases.result }}
        run: |
          echo "prepare=$PREPARE_RESULT core=$CORE_RESULT showcases=$SHOWCASE_RESULT"
          test "$PREPARE_RESULT" = success
          test "$CORE_RESULT" = success
          test "$SHOWCASE_RESULT" = success
