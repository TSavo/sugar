# Sugar CI: the acid test
#
# Drop sugar into a project, prove correctness with zero code changes.
# `make ci` runs the two suites that actually do that: `test-rust` (the rust
# workspace, including the crate-pair inheritance E2E, exercising the ts
# / python realize kits over RPC) and `test-python` (the python kit, including
# the numpy proof). No federation conformance gate; the Makefile is the
# contract.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

jobs:
  rss-floor-smoke:
    name: RSS floor smoke (synthetic 120)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2

      - name: Restore Rust target dirs
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system deps (z3, GNU time, b3sum)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends z3 time b3sum

      - name: Build RSS smoke binaries
        working-directory: implementations/rust
        run: |
          cargo build --workspace

      - name: Generate synthetic RSS fixture
        working-directory: implementations/rust
        run: |
          cargo run -p sugar-cli --example synthetic_rss_fixture -- \
            "$RUNNER_TEMP/sugar-rss-synthetic-120" \
            120 \
            --compiler target/debug/sugar-ir-smt-lib

      - name: Verify sugar verify RSS floor
        run: |
          # reference re-pinned 33096 -> 37376 (CI Linux, 2026-07-03): the
          # synthetic fixture now mints the provenance KIND warrants the
          # verifier REQUIRES (source-memento per contract, 240 contracts).
          # The old reference measured a fixture the verifier refuses today.
          sugar_bin="$(bin/sugarbin --profile debug)"
          export SUGAR_BIN="$sugar_bin"
          tools/perf/verify-rss.sh \
            --project-root "$RUNNER_TEMP/sugar-rss-synthetic-120" \
            --reference-kib 37376 \
            --label ci-linux-synthetic-120 \
            -- --quiet

  acid-test:
    name: acid test (make ci)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: implementations/rust
        run: cargo fmt --all -- --check

      - name: Restore Rust target dirs
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust target dirs
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-



      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system deps (z3, maven, vampire, b3sum)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends z3 maven unzip b3sum
          # Vampire v5.0.1 prebuilt static binary (matches tools/portfolio pin) so the
          # forall-vampire showcase runs in CI for real instead of skipping.
          curl -fsSL -o /tmp/vampire.zip https://github.com/vprover/vampire/releases/download/v5.0.1/vampire-Linux-X64.zip
          unzip -o -q /tmp/vampire.zip -d /tmp/vampire-bin
          sudo install -m 0755 /tmp/vampire-bin/vampire /usr/local/bin/vampire
          vampire --version | head -1 || true

      - name: make ci
        run: make ci
        env:
          CI: '1'
          GH_TOKEN: ${{ github.token }}

      - name: Attest published sugar binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: implementations/rust/target/release/sugar
