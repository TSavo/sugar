name: Bare exception zero tolerance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-exception-zero-tolerance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "implementations/python/sugar-lift-python-source/src:implementations/python/sugar-lift-py-tests/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: R_bare_exceptions discrimination
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_bare_exception_zero_tolerance.py
          -q
      - name: Panic-catch self-check
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/factory_panic_catch_law.py
      - name: R_bare_exceptions = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/bare_exception_zero_tolerance.py
