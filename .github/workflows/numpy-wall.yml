name: NumPy Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: read

jobs:
  numpy-wall:
    name: build numpy wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python wall inputs
        run: python -m pip install --quiet numpy

      - name: Build and check NumPy wall
        run: make numpy-wall

      - name: Upload NumPy wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-wall
          path: .sugar/numpy-wall/
          if-no-files-found: ignore

