name: NumPy Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: read
  issues: write

jobs:
  numpy-wall:
    name: build numpy wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install b3sum
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends b3sum
      - name: Install lift package deps
        run: |
          python -m pip install --quiet \
            -e implementations/python/sugar-lift-python-source \
            -e 'implementations/python/sugar-lift-py-tests[test]'
      - name: Install Python wall inputs
        run: python -m pip install --quiet numpy

      - name: Mint recovered NumPy frontier
        id: wall
        shell: bash
        env:
          SUGAR_ENGINE_LOG: ${{ github.workspace }}/.sugar/numpy-wall-logs/engine.jsonl
          SUGAR_ENGINE_HEARTBEAT_SECONDS: "5"
          SUGAR_ENGINE_CYCLE_THRESHOLD: "8"
          SUGAR_KIT_LOG: ${{ github.workspace }}/.sugar/numpy-wall-logs/transport.jsonl
          SUGAR_KIT_LOG_LEVEL: INFO
          # Return freed AST-parse arenas to the OS periodically so the
          # arena-fragmentation half of resident growth does not OOM the
          # runner. Does not touch memory pinned by live references.
          SUGAR_KIT_TRIM_EVERY: "250"
        run: |
          mkdir -p .sugar/numpy-wall-logs
          : > "$SUGAR_ENGINE_LOG"
          : > "$SUGAR_KIT_LOG"
          set +e
          make numpy-wall
          wall_exit=$?
          set -e
          echo "wall_exit=$wall_exit" >> "$GITHUB_OUTPUT"
          test -s .sugar/numpy-wall/frontier.json

      - name: Publish NumPy telemetry vector
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/wall_frontier_telemetry.py \
            --frontier .sugar/numpy-wall/frontier.json \
            --wall numpy \
            --run-url "$RUN_URL" \
            --output .sugar/numpy-wall/telemetry.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh issue comment 4102 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/numpy-wall/telemetry.md

      - name: Upload NumPy wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-wall
          path: |
            .sugar/numpy-wall-logs/engine.jsonl
            .sugar/numpy-wall-logs/transport.jsonl
            .sugar/numpy-wall/
          if-no-files-found: error
