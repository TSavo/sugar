name: NumPy Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: read
  issues: write

jobs:
  numpy-wall:
    name: build numpy wall
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lift package deps
        run: python -m pip install --quiet blake3 pynacl cbor2 pytest
      - name: Install Python wall inputs
        run: python -m pip install --quiet numpy

      - name: Mint recovered NumPy frontier
        id: wall
        shell: bash
        run: |
          set +e
          make numpy-wall
          wall_exit=$?
          set -e
          echo "wall_exit=$wall_exit" >> "$GITHUB_OUTPUT"
          test -s .sugar/numpy-wall/frontier.json

      - name: Publish NumPy telemetry vector
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/wall_frontier_telemetry.py \
            --frontier .sugar/numpy-wall/frontier.json \
            --wall numpy \
            --run-url "$RUN_URL" \
            --output .sugar/numpy-wall/telemetry.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh issue comment 4102 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/numpy-wall/telemetry.md

      - name: Upload NumPy wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-wall
          path: .sugar/numpy-wall/
          if-no-files-found: error
