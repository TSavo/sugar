name: NumPy Wall Ratchet

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: read
  issues: write

# NO `concurrency:` BLOCK. GitHub keeps one pending run per group and evicts
# the rest, which is how five package-suite runs and three sole-construction
# floor runs were lost. GitHub now retains every run; the machine-wide lease in
# No machine-wide heavy-measurement lease; jobs run in parallel.
# saturates the box, so it is exactly the workload the lease exists for.

jobs:
  numpy-wall:
    name: build numpy wall
    runs-on: [self-hosted, Linux, X64]
    # Census budget plus the wait for the lease.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install b3sum
        run: |
          tools/ci-apt-install.sh b3sum
      - name: Install lift package deps
        run: |
          python -m pip install --quiet \
            -e implementations/python/sugar-lift-python-source \
            -e 'implementations/python/sugar-lift-py-tests[test]'

      - name: Mint recovered NumPy frontier
        id: wall
        shell: bash
        env:
          SUGAR_ENGINE_LOG: ${{ github.workspace }}/.sugar/numpy-wall-logs/engine.jsonl
          # WARNING heartbeats only — per-span DEBUG is write-only hot-path
          # serialisation. Same cut as recensus #7039. Opt in: TRACE_EVENTS=1.
          SUGAR_ENGINE_TRACE_EVENTS: "0"
          SUGAR_ENGINE_HEARTBEAT_SECONDS: "5"
          SUGAR_ENGINE_CYCLE_THRESHOLD: "8"
          SUGAR_KIT_LOG: ${{ github.workspace }}/.sugar/numpy-wall-logs/transport.jsonl
          SUGAR_KIT_LOG_LEVEL: INFO
          # Return freed AST-parse arenas to the OS periodically so the
          # arena-fragmentation half of resident growth does not OOM the
          # runner. Does not touch memory pinned by live references.
          SUGAR_KIT_TRIM_EVERY: "250"
        run: |
          mkdir -p .sugar/numpy-wall-logs
          : > "$SUGAR_ENGINE_LOG"
          : > "$SUGAR_KIT_LOG"
          set +e
          make numpy-wall
          set -e
          test -s .sugar/numpy-wall/frontier.json

      # A frontier whose numbers were taken beside another census is a frontier
      # about the box, not about NumPy.
      - name: Publish NumPy conservation vector + ΔR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # #4263: post-merge instrument. Mint the closed conservation vector,
          # diff against the prior #4102 ledger entry (advisory), and comment
          # the absolute vector + ΔR. Unexplained movement is loud telemetry to
          # fix forward — not a reason to have blocked the merge.
          summary_args=()
          if [ -f .sugar/numpy-wall/summary.json ]; then
            summary_args=(--summary .sugar/numpy-wall/summary.json)
          fi
          python tools/wall_frontier_telemetry.py \
            --frontier .sugar/numpy-wall/frontier.json \
            "${summary_args[@]}" \
            --wall numpy \
            --run-url "$RUN_URL" \
            --output .sugar/numpy-wall/telemetry.md \
            --vector-json-out .sugar/numpy-wall/conservation-vector.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

          : > .sugar/numpy-wall/delta.md
          python tools/wall_ledger_previous_vector.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue 4102 \
            --wall numpy \
            --skip-run "$RUN_URL" \
            --output .sugar/numpy-wall/previous-vector.json \
            || true
          if [ -s .sugar/numpy-wall/previous-vector.json ]; then
            python tools/wall_conservation_diff.py \
              --before-vector-json .sugar/numpy-wall/previous-vector.json \
              --after-vector-json .sugar/numpy-wall/conservation-vector.json \
              --wall numpy \
              --before-label "prior #4102 ledger" \
              --after-label "this mint" \
              --run-url "$RUN_URL" \
              --advisory \
              --markdown-out .sugar/numpy-wall/delta.md \
              --json-out .sugar/numpy-wall/conservation-delta.json \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            {
              echo "### numpy wall conservation ΔR"
              echo "No prior machine vector on #4102 — this mint is the ledger baseline."
            } | tee -a "$GITHUB_STEP_SUMMARY" | tee .sugar/numpy-wall/delta.md
          fi

          {
            cat .sugar/numpy-wall/telemetry.md
            echo
            cat .sugar/numpy-wall/delta.md
          } > .sugar/numpy-wall/ledger-comment.md

          gh issue comment 4102 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/numpy-wall/ledger-comment.md
          gh issue comment 4263 --repo "$GITHUB_REPOSITORY" \
            --body-file .sugar/numpy-wall/ledger-comment.md


      - name: Upload NumPy wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-wall
          path: |
            .sugar/numpy-wall-logs/engine.jsonl
            .sugar/numpy-wall-logs/transport.jsonl
            .sugar/numpy-wall/
          if-no-files-found: error
