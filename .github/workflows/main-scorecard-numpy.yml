name: Main scorecard numpy

# WHY THIS EXISTS (#8416)
#
# numpy is the second yardstick of the nine-step lane. Its compiled C is the
# boundary of the Python lifter: a call into C is an `undecided` member with
# reason `unanswered` (an unbound edge, its halt kept), which is correct and
# not counted against the lane. A Python function or module body the lifter
# refuses by name is an `undecided` member with reason `refused`: a miss.
#
# The corpus is the numpy the measured closure already pins beside pandas
# 3.0.3 (`numpy==2.5.1` in sugar-lift-py-tests[test]), resolved and
# authenticated by authenticated_pytest.authenticated_numpy_corpus: the
# environment authentication pandas uses (exact version, this interpreter's
# own site-packages, dist-info agreeing), then every enrolled file checked
# byte for byte against numpy's RECORD. Enrollment is the pandas rule
# (SourceTree.paths: every *.py, tests included).
#
# Every enrolled file goes through tools/nine_step_lift_lane.py, the one lane
# script the pandas lane also runs: `sugar mint` and `sugar dump` per file,
# then `sugar prove` per file with the numpy proofs it imports staged in
# .sugar/imports/ (cross-module edges bind; see main-scorecard-board.yml,
# CROSS-MODULE EDGES BIND), LIFT_SEATS seats of --slice i/K on one runner,
# then the join.
# A seat runs LIFT_WORKERS files at once, slowest first by the previous numpy
# run's rows (order only, nothing carried), each inside the one 300 s
# ceiling, and starts no file it could not finish inside LIFT_SEAT_CAP_S; its
# rows live under $HOME/.cache/sugar-lift-lane/<run id>, so a re-run attempt
# on the same runner resumes (see main-scorecard-board.yml, ONE SEAT). The
# row on the "Main scorecard" issue carries
# `numpy_lift_files=M/N numpy_lift_funcs=F/T numpy_refused=R` and the top
# refusal names, posted with `--lane` (the poster's label-generic lane
# measure, sticky best per label).
#
# Gate, wait and supersede are the board's (main-scorecard-board.yml): the
# fast lane measures first, an hourly run never replaces a push run, and a
# merge burst measures the numpy lane of its head.
#
# ONE HEAVY LANE AT A TIME (main-scorecard-board.yml; run 43996546638 was
# cancelled at 02:28:16Z together with the board and the pandas lift seat it
# had started beside). The `wait` job also holds until main-scorecard-board.yml's
# run on this commit (board, pandas lift seat, lift join) finished
# (AFTER_WORKFLOWS), so numpy takes the host alone. That wait is the fast
# lane (~15 min) + the board (~10 min) + the pandas lift seat (<= 100 min),
# so its cap is 330 min, inside the GitHub-hosted 360.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: main-scorecard-numpy-${{ github.sha }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  # One seat; files run side by side inside it (the script's load gate,
  # 1.25 x CPUs, guards the shared host; numpy runs after the pandas lanes).
  LIFT_SEATS: "1"
  LIFT_WORKERS: "12"
  LIFT_SEAT_CAP_S: "7200"
  LIFT_JOIN_CAP_S: "300"
  SCORECARD_ISSUE_TITLE: "Main scorecard"
  SCORECARD_MEASURES: "lift"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  supersede:
    name: cancel superseded runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_supersede.sh
          sparse-checkout-cone-mode: false
      - name: Cancel older runs on other commits
        shell: bash
        run: bash tools/main_scorecard_supersede.sh main-scorecard-numpy.yml

  gate:
    name: schedule gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.gate.outputs.measure }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_schedule_gate.sh
          sparse-checkout-cone-mode: false
      - name: Does this head still need a row?
        id: gate
        shell: bash
        run: bash tools/main_scorecard_schedule_gate.sh main-scorecard-numpy.yml

  # The fast lane, then main-scorecard-board.yml on this commit (ONE HEAVY
  # LANE AT A TIME). The cap (330 min) ends the wait before the job's 345.
  wait:
    name: wait for the fast lane and the pandas lanes
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      AFTER_WORKFLOWS: main-scorecard-board.yml
      FAST_LANE_WAIT_CAP_S: "19800"
    outputs:
      measure: ${{ steps.wait.outputs.measure }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_wait_fast_lane.sh
          sparse-checkout-cone-mode: false
      - name: Wait until the fast lane on this commit finished
        id: wait
        shell: bash
        run: bash tools/main_scorecard_wait_fast_lane.sh

  lift:
    name: numpy lift
    needs: [gate, wait]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' && needs.wait.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    # Set-up and the release build (~10 min), LIFT_SEAT_CAP_S (120 min) plus
    # the 5 min KILL backstop, LIFT_JOIN_CAP_S (5 min), the post and the
    # uploads: 140 min at most, inside 165.
    timeout-minutes: 165
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      # The one lift lane set-up (interpreter, venv, Rust, z3, the numpy
      # corpus resolved and authenticated), shared with lift-trace.yml.
      - name: Lift lane setup (numpy)
        id: corpus
        uses: ./.github/actions/lift-lane-setup
        with:
          corpus: numpy
      - name: Timing prior (an earlier run's rows; order only)
        shell: bash
        run: |
          set +e -uo pipefail
          # The newest earlier numpy run with rows orders this run's files
          # slowest first. Nothing from it is counted or carried.
          mkdir -p numpy-prior
          for id in $(gh run list --workflow main-scorecard-numpy.yml --branch main \
                        --limit 10 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --name numpy-lift \
                 --dir "numpy-prior/$id" >/dev/null 2>&1; then
              echo "timing prior: run $id, $(cat numpy-prior/"$id"/s*/rows.jsonl 2>/dev/null | wc -l) rows"
              break
            fi
            rm -rf "numpy-prior/$id"
          done
          true
      - name: Seats + join (sugar mint per file, then sugar prove with its imports)
        shell: bash
        env:
          NUMPY_CORPUS: ${{ steps.corpus.outputs.root }}
          NUMPY_FILES: ${{ steps.corpus.outputs.files }}
        run: |
          set +e -uo pipefail
          export SUGAR_HOME="$GITHUB_WORKSPACE/.sugar"
          export SUGAR_BIN="$(bin/sugarbin --profile release)"
          bin/sugarbin --profile release --bin sugar-ir-smt-lib >/dev/null
          # Rows live outside the workspace, keyed by this run, so a re-run
          # attempt on this runner resumes; state older than a day goes.
          STATE_BASE="$HOME/.cache/sugar-lift-lane"
          STATE="$STATE_BASE/$GITHUB_RUN_ID"
          mkdir -p "$STATE"
          touch -d '-1 day' "$STATE_BASE/.prune-before"
          for d in "$STATE_BASE"/*/; do
            [ "$d" -ot "$STATE_BASE/.prune-before" ] && rm -rf "$d"
          done
          OUT="$GITHUB_WORKSPACE/numpy-lift"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          K="$LIFT_SEATS"
          for i in $(seq 0 $((K - 1))); do
            (
              # The script stops starting files in time to finish inside
              # LIFT_SEAT_CAP_S; the KILL is only the backstop.
              timeout -s KILL "$((LIFT_SEAT_CAP_S + 300))" \
                python -u tools/nine_step_lift_lane.py \
                  --corpus-root "$NUMPY_CORPUS" \
                  --label numpy \
                  --slice "$i/$K" \
                  --out-dir "$STATE/numpy-s$i" \
                  --workers "$LIFT_WORKERS" \
                  --seat-budget "$LIFT_SEAT_CAP_S" \
                  --prior numpy-prior \
                  > "$OUT/s$i.log" 2>&1
              echo $? > "$OUT/s$i.rc"
            ) &
          done
          wait
          dirs=()
          for i in $(seq 0 $((K - 1))); do
            echo "numpy lift seat s$i rc=$(cat "$OUT/s$i.rc" 2>/dev/null || echo missing)"
            rm -rf "$STATE/numpy-s$i/work" "$STATE/numpy-s$i/store"
            mkdir -p "$OUT/s$i"
            cp "$STATE/numpy-s$i/rows.jsonl" "$OUT/s$i/rows.jsonl"
            grep -E "^numpy seat |^seat budget|^holding|^resuming|^retry" "$OUT/s$i.log" | tail -n 20
            dirs+=("$OUT/s$i")
          done
          timeout -s KILL "$LIFT_JOIN_CAP_S" \
            python -u tools/nine_step_lift_lane.py --join "${dirs[@]}" \
              --label numpy --enrolled "$NUMPY_FILES" \
              --out "$OUT/summary.json" --refusals "$OUT/refusals.json" \
              --edge-misses "$OUT/edge-misses.json" \
              > "$OUT/join.log" 2>&1
          echo "join rc=$?"
          cat "$OUT/join.log"
      - name: Post the numpy lane (final row)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          # A missing summary is unmeasured, never a partial count.
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" --final \
            --lane numpy-lift/summary.json
      - name: Upload the compact refusal list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: numpy-lift-refusals
          overwrite: true
          path: |
            numpy-lift/refusals.json
            numpy-lift/edge-misses.json
          if-no-files-found: warn
      - name: Upload seat logs and the join
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: numpy-lift
          # A re-run attempt replaces the earlier upload.
          overwrite: true
          path: |
            numpy-lift/*.log
            numpy-lift/*.rc
            numpy-lift/summary.json
            numpy-lift/s*/rows.jsonl
          if-no-files-found: warn
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"
