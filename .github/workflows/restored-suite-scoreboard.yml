name: Restored Suite Scoreboard

# SUPERSEDED, NOT YET RETIRED. This workflow still builds its own environment
# and runs its own whole-package sweep. That is now the SECOND such sweep:
# .github/workflows/python-package-suite.yml owns the authoritative one, on
# every PR and push, with an exact node-ID manifest. Two independent sweeps
# means two sets of numbers that were never guaranteed to be comparable, which
# is exactly the ownership defect the authoritative job exists to end.
#
# It survives this change only because deleting it is not a workflow edit: the
# file name is pinned by `[tasks.restored-suite-scoreboard]` in
# sugar-build.toml, by tests/test_sugar_build_contract.py (with a hashed task
# digest), and by implementations/rust/sugar-cli/tests/sugarbin_execution_contract.rs,
# which asserts this file's SUGAR_AMBIENT_DEPENDENCY_OWNER line verbatim.
# Retiring it means moving its #4208 telemetry onto the canonical artifact and
# re-pinning that contract — a deliberate change with its own receipt, not a
# side effect of wiring the suite job.
#
# Until then: when these two disagree, the authoritative job is the measurement
# and this one is prior art.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  issues: write

# NO `concurrency:` BLOCK. A group with cancel-in-progress: false still keeps
# only ONE pending run and evicts the rest -- that is how five package-suite
# runs and three sole-construction floor runs were lost. GitHub now retains
# every run; tools/heavy_measurement_lease.py decides which one measures.
#
# This sweep is SUPERSEDED but still whole-package and still heavy, so it goes
# behind the same machine-wide lease as the authoritative one. Retiring it is a
# separate change with its own receipt (see the header above); leaving it
# outside the lease in the meantime would mean the authoritative suite could be
# timed against a second full sweep of the same package on the same box.

jobs:
  restored-suite:
    name: mint restored-suite telemetry
    runs-on: [self-hosted, Linux, X64]
    # Sweep budget plus the wait for the lease.
    timeout-minutes: 360
    env:
      # This job already runs inside the battleaxe runner container. It chooses
      # local ambient explicitly instead of trying to SSH back into its host.
      SUGAR_EXECUTION_ROUTE: local-ambient
      SUGAR_AMBIENT_DEPENDENCY_OWNER: .github/workflows/restored-suite-scoreboard.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: "pip"

      - name: Install and verify ambient system dependencies
        shell: bash
        run: |
          set -euo pipefail
          tools/ci-apt-install.sh z3 time
          versions="$(python tools/sugar-build/contract.py tool-versions)"
          expected_z3="$(python -c 'import json,sys; print(json.load(sys.stdin)["z3"])' <<<"$versions")"
          expected_b3sum="$(python -c 'import json,sys; print(json.load(sys.stdin)["b3sum"])' <<<"$versions")"
          z3 --version | tee /tmp/sugar-z3-version
          grep -F "version $expected_z3" /tmp/sugar-z3-version
          /usr/bin/time --version | head -1
          if ! command -v b3sum >/dev/null 2>&1 \
            || ! b3sum --version | grep -Fq "b3sum $expected_b3sum"; then
            cargo install b3sum --version "$expected_b3sum" --locked
          fi
          b3sum --version | tee /tmp/sugar-b3sum-version
          grep -Fx "b3sum $expected_b3sum" /tmp/sugar-b3sum-version

      - name: Install ambient restored-suite dependencies
        run: |
          python -m venv "$RUNNER_TEMP/restored-suite-python"
          "$RUNNER_TEMP/restored-suite-python/bin/python" -m pip install --quiet --upgrade pip
          # Sole dep authority: sugar-lift-py-tests[test] (pyproject.toml).
          "$RUNNER_TEMP/restored-suite-python/bin/python" -m pip install --quiet --no-cache-dir \
            -e implementations/python/libsugar-py \
            -e implementations/python/sugar-emit-python-hypothesis \
            -e implementations/python/sugar-emit-python-pytest \
            -e implementations/python/sugar-emit-python-unittest \
            -e implementations/python/sugar-build-witness \
            -e implementations/python/sugar-lift-py-pytest-witness \
            -e 'implementations/python/sugar-lift-py-tests[test]' \
            -e implementations/python/sugar-lift-python-source
          bin/sugarbin --profile release >/dev/null


      - name: Run restored suite and retain red telemetry
        id: suite
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/restored-sweep.sh" <<'SWEEP'
          set -uo pipefail
          SUGAR_BIN="$(bin/sugarbin --profile release)" \
            "$RUNNER_TEMP/restored-suite-python/bin/python" -m pytest -q \
            implementations/python/sugar-lift-py-tests/tests \
            2>&1 | tee restored-suite.log
          exit "${PIPESTATUS[0]}"
          SWEEP
          set +e
          python3 tools/heavy_measurement_lease.py \
            --class restored-suite-scoreboard \
            --record "$GITHUB_WORKSPACE/lease-record.json" \
            -- bash "$RUNNER_TEMP/restored-sweep.sh"
          leased_exit=$?
          set -e
          if [ "$leased_exit" = "75" ]; then
            echo "::error::heavy-measurement lease not acquired; the restored suite did NOT run."
            echo "pytest_exit=lease-refused" >> "$GITHUB_OUTPUT"
            exit 75
          fi
          echo "pytest_exit=$leased_exit" >> "$GITHUB_OUTPUT"
          test -s restored-suite.log

      - name: Lease gate (R_lease = 0)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/heavy_measurement_lease_gate.py \
            --record "$GITHUB_WORKSPACE/lease-record.json" \
            --require-commit "$GITHUB_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish restored-suite vector
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/restored_suite_telemetry.py \
            --log restored-suite.log \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}" \
            --run-url "$RUN_URL" \
            --output restored-suite-telemetry.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh issue comment 4208 --repo "$GITHUB_REPOSITORY" \
            --body-file restored-suite-telemetry.md

      - name: Upload restored-suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-suite-scoreboard
          path: |
            restored-suite.log
            restored-suite-telemetry.md
            lease-record.json
          if-no-files-found: error
