name: Heavy measurement attendance (roll call)

# THE DEFECT THIS FIXES
#
# tools/heavy_measurement_attendance.py existed, was correct, and was invoked
# by NOTHING. Its own docstring names the failure it was written to catch:
#
#     absent artifact == "no failures reported" == looks like a clean floor
#     R is not 0, R is UNMEASURED
#
# On 2026-08-01 that is exactly what happened. An empty commit was pushed to
# main to take one clean measurement of the merged tree. Six workflows ran;
# three went green and three went red, and NOT ONE of them measured the corpus:
# the sole-construction floors refused under the lease (auth failure, then a
# zero-claim refusal), the package suite hit an unevictable root-owned shelf
# cell and emitted no suite-report.json, and the three greens are
# DISCRIMINATION workflows that prove an instrument can tell a planted offender
# from a clean one -- they say nothing about pandas. The roll call would have
# reported R_attendance and named every silent class. It was never called.
#
# An instrument nobody runs is not an instrument. Enrollment is existence.
#
# WHY workflow_run AND NOT A STEP INSIDE ci.yml
#
# The roll call is a question about a COMMIT, not about a run: which enrolled
# heavy classes spoke about this tip? It can only be answered after the heavy
# classes settle, so a step inside ci.yml would race them and report a false
# absence. Triggering on workflow_run completion recomputes the roll call each
# time a heavy class finishes; the reading converges as they land. A class that
# never runs never flips to present, so its silence stays loud forever rather
# than being papered over by a single early reading.

on:
  workflow_run:
    workflows:
      - "Python package suite (authoritative)"
      - "Python sole-construction floors (R>0 red)"
      - "NumPy Wall Ratchet"
      - "Pandas Wall Ratchet"
      - "Restored Suite Scoreboard"
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to hold the roll call for"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  roll-call:
    name: roll call (R_attendance = 0)
    runs-on: ubuntu-latest
    env:
      # Phase lines must hit the job log as they print (silence conceals hang).
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Phase: resolve roll-call subject commit"
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.inputs.commit || github.event.workflow_run.head_sha }}"
          [ -n "$sha" ] || { echo "no commit to hold a roll call for"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "attendance phase=resolve_subject status=done sha=$sha"

      - name: "Phase: collect measurement receipts (download artifacts)"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p receipts
          # Every run for this SHA, from the API. NOT `gh run list` -- that
          # under-reports: on 2026-08-01 it returned 6 non-completed runs where
          # the API returned 234, and a bankruptcy sweep was declared complete
          # on the strength of it.
          echo "attendance phase=list_runs status=start sha=$SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --paginate --jq '.workflow_runs[]?|.id' > run-ids.txt || true
          total=$(wc -l < run-ids.txt | tr -d ' ')
          echo "attendance phase=list_runs status=done runs=$total"
          index=0
          while read -r id; do
            [ -z "$id" ] && continue
            index=$((index + 1))
            echo "attendance phase=download_run index=${index}/${total} run_id=$id status=start"
            if gh run download "$id" --dir "receipts/$id" 2>/dev/null; then
              echo "attendance phase=download_run index=${index}/${total} run_id=$id status=ok"
            else
              echo "attendance phase=download_run index=${index}/${total} run_id=$id status=no_artifacts"
            fi
          done < run-ids.txt
          json_n=$(find receipts -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "attendance phase=collect_receipts status=done json_files=$json_n"

      - name: "Phase: roll call (expected vs spoke)"
        id: attendance
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.subject.outputs.sha }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          # PER-COMMIT cadence only. Nightlies are a different obligation.
          # CRITICAL: attendance exit 1 must NOT skip compose/gate.
          set +e
          python3 -u tools/heavy_measurement_attendance.py \
            --commit "$SHA" \
            --cadence per-commit \
            --receipts-dir receipts \
            --repo "${GITHUB_REPOSITORY}" \
            --partial-json receipts/attendance-partial.json \
            > attendance.md 2>&1
          att_exit=$?
          set -e
          cat attendance.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "attendance_exit=$att_exit" | tee -a "$GITHUB_OUTPUT"
          echo "attendance phase=roll_call status=done exit=$att_exit"

      - name: "Phase: CommitMeasurement compose + gate"
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.subject.outputs.sha }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          att_exit="${{ steps.attendance.outputs.attendance_exit }}"
          # Compose even when receipts/ are empty: that is PartialVector, not silence.
          echo "attendance phase=compose status=start"
          python3 -u - <<'PY'
          from pathlib import Path
          import json
          import importlib.util
          import os
          print("attendance phase=compose status=loading_commit_measurement", flush=True)
          spec = importlib.util.spec_from_file_location(
              "cm", Path("tools/commit_measurement.py")
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          sha = os.environ["SHA"]
          vector = mod.compose_tip_from_receipts_dir(sha, Path("receipts"))
          Path("commit-measurement.json").write_text(
              json.dumps(vector.to_json(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(vector.to_json(), indent=2, sort_keys=True), flush=True)
          print("attendance phase=compose status=done", flush=True)
          PY

          set +e
          echo "attendance phase=gate status=start"
          python3 -u tools/commit_measurement_gate.py \
            --composition commit-measurement.json \
            --require-complete \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gate_exit=$?
          set -e
          echo "gate_exit=$gate_exit"
          echo "attendance phase=gate status=done exit=$gate_exit"
          # Fail closed: either attendance minority OR incomplete composition.
          if [ "$att_exit" != "0" ] || [ "$gate_exit" -ne 0 ]; then
            echo "RED: attendance_exit=$att_exit gate_exit=$gate_exit"
            exit 1
          fi
          echo "GREEN: attendance and CommitMeasurement complete"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-measurement-attendance-${{ steps.subject.outputs.sha }}
          path: |
            attendance.md
            commit-measurement.json
            receipts/attendance-partial.json
          if-no-files-found: warn
