name: Python native-crash floor (discrimination)

# Discrimination only. Full corpus R_native_crashes runs exclusively under
# factory-zero-tolerance.yml (one heavy orchestrator).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-crash-discrimination:
    name: native-crash-discrimination
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `sugar-lift-py-tests[test]` is the sole dependency authority. Never
      # hand-list a package here: a hand-list is one module-scope import away
      # from the #6260 collection abort this floor exists to catch.
      - name: Install Python lift kit
        run: >-
          python -m pip install
          -e ./implementations/python/sugar-lift-python-source
          -e ./implementations/python/sugar-source-tree
          -e './implementations/python/sugar-lift-py-tests[test]'
      - name: R_native_crashes discrimination
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_native_crash_zero_tolerance.py
          -q
