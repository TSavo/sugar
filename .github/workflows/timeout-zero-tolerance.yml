name: Timeout zero tolerance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-zero-tolerance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: R_timeouts discrimination
        run: >-
          python -m pytest --noconftest
          implementations/python/sugar-lift-py-tests/tests/test_timeout_zero_tolerance.py
          -q
      - name: R_timeouts = 0
        run: >-
          python
          implementations/python/sugar-lift-py-tests/scripts/timeout_zero_tolerance.py
