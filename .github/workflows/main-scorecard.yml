name: Main scorecard

# WHY THIS EXISTS
#
# CI must measure main. Before this workflow:
# - the package suite on main never completed: every merge replaced the
#   pending run (python-package-suite.yml concurrency is workflow-ref);
# - the pandas board ran only by hand (/home/tsavo/sugar-pass-kit/run.sh);
# - the solver twins and examples/python-base64-federation/run.sh ran nowhere.
#
# This workflow measures the tip of main on every merge (push to main), once
# an hour, and on demand, and posts one row of numbers on the "Main scorecard"
# issue. Every job checks out github.sha, so every number in a row is about
# one commit, and the row names the PRs merged since the previous row.
#
# SUPERSEDED RUNS ARE CANCELLED (#8416, 2026-11-16)
#
# With one concurrency group and cancel-in-progress false, the run on the
# first commit of a merge burst kept the three self-hosted runners while the
# run on the head sat pending behind it (25 minutes lost). The concurrency
# group is now per commit (a second run on the same commit waits; a run on a
# newer commit never does), and the `supersede` job
# (tools/main_scorecard_supersede.sh) cancels every older run of this
# workflow on main whose commit is not this run's. A run is never cancelled
# by a run on its own commit. The board (main-scorecard-board.yml) waits for
# this workflow's run on the same commit before it asks for a runner.
#
# THE BOARD HAS ITS OWN LANE (2026-11-15)
#
# This workflow measures the package suite, the solver twins, the
# federation example and the Rust tests of the prove path. The pandas board is main-scorecard-board.yml, with its
# own concurrency group: while the board was a job here, one run held the
# group until the board finished (over an hour), so merges got no row in
# between. Both workflows post rows on the same issue; each names its numbers
# in SCORECARD_MEASURES and writes `-` for the other's.
#
# A ROW IN SECONDS, NOT HOURS (owner, 2026-11-14)
#
# The first run posted nothing for over an hour: every job rebuilt the
# environment, everything was measured from scratch, and the row was written
# only after the slowest job. Now:
#
# 1. Nothing is carried (#8416, 2026-11-16). A carry recorder
#    (tools/scorecard_carry.py, sys.monitoring re-instrumenting live bytecode
#    on every test) used to fingerprint what each test and board file ran and
#    carry unchanged results forward. It carried nothing (every row said
#    carried=suite:0, every test opaque to it) and was the prime suspect for
#    the suite shards' intermittent segfaults (exit 139, runs 43832361876 and
#    43841836171). It is deleted: every test runs on every run, the row's
#    rerun= is each measure's total and carried= is 0. Only the federation
#    example's PASS is still carried, by a tree key (the federation job).
# 2. Zero setup. tools/main_scorecard_env.sh keeps one persistent venv per
#    dependency key in the cache directory every runner shares (pandas
#    pinned with it) and puts gh on PATH; the sugar binary comes from
#    bin/sugarbin's shelf; z3 is installed once; the Rust toolchain is set
#    up only when something will actually run.
# 3. Each job posts its own number. A measuring job banks its result in the
#    run's shared directory and creates or edits the run's comment at once
#    (tools/main_scorecard_post.py); anything still measuring is `?` and
#    named pending. The final scorecard job marks whatever never reported as
#    unmeasured.
#
# Regression alarm: each number is compared with the newest earlier row in
# which it was measured. Any number that got worse (or was measured before
# and is unmeasured now) makes the comment start with REGRESSION: and turns
# the posting job red. Pending numbers are never compared.
#
# GitHub runs `shell: bash` as `bash -e`: every step whose commands may exit
# nonzero on purpose (pytest, run.sh, the recensus) says `set +e` (#8293).
#
# THE HOUR NEVER REPLACES A PUSH (#8416)
#
# The hourly run measures the head of main. Sharing the push runs' group, it
# replaced the push run waiting there for the same head (0c85193a5,
# 41f6d6298) and measured that head again. The scheduled run has its own
# group (`-schedule`), so it never replaces a push run, and its `gate` job
# (tools/main_scorecard_schedule_gate.sh) makes it a no-op when a run of this
# workflow on the head is queued or measuring or already posted its row.
# Push and dispatch runs skip the gate.
#
# ONE POOL OF SHARDS (#8416, 2026-11-16)
#
# Measured on runs 43789294103, 43793978518, 43781133041: the twins were one
# 20-21 minute pytest (564 tests) that re-ran the 50 twin files the suite
# shards had already run, and the 8 suite shards, cut by equal file counts
# because the LPT prior lived in the wiped workspace, took 2 to 17 minutes
# each (57 runner-minutes in all). Now the plan job packs every file that
# must run (suite files, plus the 2 twin files outside the suite tree) onto
# the shards by measured cost (tools/main_scorecard_suite.sh,
# tools/main_scorecard_shard_plan.py, the prior in the shared cache), and
# the twins number is counted from the suite's own results for the twin
# files in the suite tree. The federation example and the Rust tests are
# their own short jobs.
#
# THE SOURCE TREE'S TESTS (2026-11-16)
#
# The 183 test files under implementations/python/sugar-source-tree/tests ran
# in no CI job, so stale tests there were invisible. The plan packs them onto
# the same shards by the same measured-cost prior (no serial job); each shard
# runs them in their own pytest (the package's own config, after the suite
# and twins, under TREE_SHARD_BUDGET_SECONDS), and the join posts them as
# `tree=P/T`, so `suite=` keeps counting exactly what it counted before. A
# lost tree shard is `incomplete:` like the suite's; the alarm fires when tree
# failing rises or its total falls. The venv already holds the package's
# dependencies (tools/main_scorecard_env.sh wheels sugar-source-tree) and the
# managed PYTHONPATH already has its src.
#
# A LOST SHARD IS NEVER A SMALLER TOTAL (#8416, run 43832361876)
#
# Shard 2 failed in its toolchain step (rustup re-fetched the 1.96.0 channel
# checksum and the TLS peer closed) and shard 1's pytest died with SIGSEGV;
# neither left results, the join summed the other six, and the row posted
# suite=4209/4212 as measured with ~1450 tests missing. Now the plan writes
# how many shards it made and how many files and tests each was planned
# (shards.json); the join checks every planned shard left its results, and a
# missing one makes the measure unmeasured (`?/?`, `incomplete:` note). A
# shard whose pytest did not run its tests fails, so "re-run failed jobs"
# redoes only it: shard results live in the run's plan directory, shared by
# every attempt, and the final row reads the other jobs' numbers from the
# earlier attempt. The alarm also flags a measure's total falling more than
# 2% below its last measured total. The Rust toolchain comes from the
# runner's own rustup with no network when the pin is installed
# (tools/ci-rust-toolchain.sh); the shards still need it on PATH, because
# bin/sugarbin keys and resolves the sugar binary through cargo and rustc.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: main-scorecard-fast-${{ github.sha }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SUITE_SHARD_COUNT: "8"
  SCORECARD_ISSUE_TITLE: "Main scorecard"
  # The numbers this workflow reports; the board is main-scorecard-board.yml.
  # `tree` is implementations/python/sugar-source-tree/tests, run on the
  # suite shards but posted as its own number so `suite` stays comparable.
  SCORECARD_MEASURES: "suite,twins,federation,rust,tree"
  # Each shard's source-tree pytest is interrupted past this wall (a hung
  # tree test marks the tree incomplete; the shard's suite still counts).
  TREE_SHARD_BUDGET_SECONDS: "900"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # ------------------------------------------ superseded runs are cancelled
  # Every older run of this workflow on main whose commit is not this run's.
  # On a GitHub-hosted runner, and nothing waits for it: the measuring jobs
  # ask for a self-hosted runner at once.
  supersede:
    name: cancel superseded runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_supersede.sh
          sparse-checkout-cone-mode: false
      - name: Cancel older runs on other commits
        shell: bash
        run: bash tools/main_scorecard_supersede.sh main-scorecard.yml

  # ------------------------------------------------- (0) the schedule's gate
  # Scheduled runs only: measure=false when this head is already queued,
  # measuring or posted. Skipped on push and dispatch, where every job runs.
  # A gate that fails leaves measure empty, so the run measures.
  gate:
    name: schedule gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.gate.outputs.measure }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/main_scorecard_schedule_gate.sh
          sparse-checkout-cone-mode: false
      - name: Does this head still need a row?
        id: gate
        shell: bash
        run: bash tools/main_scorecard_schedule_gate.sh main-scorecard.yml

  # ------------------------------------- (1) package suite + (2) solver twins
  # The plan: every file, packed onto the SUITE_SHARD_COUNT shards by
  # measured cost. The shards run them; the join posts the numbers.
  suite:
    name: package suite + twins (plan)
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Plan (which test files run on which shard)
        shell: bash
        run: bash tools/main_scorecard_suite.sh plan
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # The files fan out over the shards the plan packed.
  suite-shard:
    name: suite shard ${{ matrix.shard }}
    needs: [suite]
    if: ${{ !cancelled() && needs.suite.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Rust toolchain (the runner's installed pin; no download)
        uses: ./.github/actions/setup-rust-cache
      - name: Install z3 (cached on the runner)
        shell: bash
        run: tools/ci-apt-install.sh z3
      - name: Shard ${{ matrix.shard }}
        shell: bash
        run: bash tools/main_scorecard_suite.sh run ${{ matrix.shard }}
      - name: Upload shard logs
        # always(): a crashed shard's log (faulthandler stacks, the test it
        # was running) survives whatever happened to the job.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-suite-shard-${{ matrix.shard }}
          path: |
            suite.log
            twins.log
            tree.log
            twin-evidence/**
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  suite-join:
    name: suite join
    needs: [suite, suite-shard]
    if: ${{ !cancelled() && needs.suite.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Post the suite, twins and tree numbers
        shell: bash
        run: bash tools/main_scorecard_suite.sh post

  # ------------------------------------------------------- (3) federation
  federation:
    name: federation
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          # The federation example is a chain of subprocesses, so it is not
          # traced: a PASS is carried only while every input outside docs/
          # and the other examples is byte-identical (git tree hashes). A
          # FAIL is never carried.
          key="$(python tools/scorecard_carry.py verdict key \
            --exclude docs --exclude examples \
            --include examples/python-base64-federation \
            --extra "z3=$(z3 --version 2>/dev/null || echo none)")"
          echo "fed_key=$key" >> "$GITHUB_OUTPUT"
          if [ "$(python tools/scorecard_carry.py verdict get --store "$SCORECARD_STORE" \
                --name python-base64-federation --key "$key" 2>/dev/null || true)" = PASS ]; then
            echo "fed_carried=true" >> "$GITHUB_OUTPUT"
          else
            echo "fed_carried=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Rust toolchain (only when the example runs)
        if: steps.plan.outputs.fed_carried != 'true'
        uses: ./.github/actions/setup-rust-cache
      - name: Install z3 (cached on the runner)
        if: steps.plan.outputs.fed_carried != 'true'
        shell: bash
        run: tools/ci-apt-install.sh z3
      - name: Run examples/python-base64-federation/run.sh
        id: fed
        if: ${{ !cancelled() && steps.plan.outputs.fed_carried != 'true' }}
        shell: bash
        env:
          FED_KEY: ${{ steps.plan.outputs.fed_key }}
        run: |
          set +e -uo pipefail
          export PYTHON_LITERAL_BASE64_VENV="$SCORECARD_CACHE/python-literal-base64-venv"
          bash examples/python-base64-federation/run.sh > federation.log 2>&1
          rc=$?
          cat federation.log
          if [ "$rc" -eq 0 ]; then verdict=PASS; else verdict=FAIL; fi
          last_fail="$(grep -a 'FAIL' federation.log | tail -n 1 | tr -d '\r' | cut -c1-200)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "last_fail=$last_fail" >> "$GITHUB_OUTPUT"
          echo "federation rc=$rc verdict=$verdict last_fail=$last_fail"
          if [ "$verdict" = PASS ] && [ -n "$FED_KEY" ]; then
            python tools/scorecard_carry.py verdict put --store "$SCORECARD_STORE" \
              --name python-base64-federation --key "$FED_KEY" --value PASS
          fi
      - name: Post the federation verdict
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FED_CARRIED: ${{ steps.plan.outputs.fed_carried }}
          FED_VERDICT: ${{ steps.fed.outputs.verdict }}
          FED_LAST_FAIL: ${{ steps.fed.outputs.last_fail }}
        run: |
          set +e -uo pipefail
          if [ "$FED_CARRIED" = true ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set federation.verdict=PASS --set federation.carried=true
          elif [ -n "$FED_VERDICT" ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set "federation.verdict=$FED_VERDICT" \
              --set "federation.last_fail=$FED_LAST_FAIL"
          else
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set federation.measured=false \
              --set "federation.note=run.sh did not run"
          fi
      - name: Upload log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-federation
          path: federation.log
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # ------------------------------------------------------ (4) rust tests
  # The Rust unit and integration tests of the crates on the Python proof
  # path. No other workflow runs `cargo test`, so before this job the tests
  # PRs added to these crates never ran. The target directory lives in the
  # cache directory every runner shares, so a run recompiles only what the
  # SHA changed (cargo locks it against a concurrent build). `--no-fail-fast`
  # so one failing test binary does not hide the rest; the number is the sum
  # of cargo's `test result:` lines over the crates. A crate that exits
  # nonzero with no failing test did not build: the measure is then
  # unmeasured, never a smaller total.
  rust:
    name: rust tests
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache
      - name: Install z3 (cached on the runner)
        shell: bash
        run: tools/ci-apt-install.sh z3
      - name: cargo test (sugar-verifier, sugar-ir-compiler-smt-lib, sugar-compiler, sugar-cli)
        id: cargo
        shell: bash
        working-directory: implementations/rust
        run: |
          set +e -uo pipefail
          export CARGO_TARGET_DIR="$SCORECARD_CACHE/rust-test-target"
          export CARGO_TERM_COLOR=never
          log="$GITHUB_WORKSPACE/rust.log"
          : > "$log"
          passed=0; failed=0; broken=""; lines=""
          for crate in sugar-verifier sugar-ir-compiler-smt-lib sugar-compiler sugar-cli; do
            t=$(date +%s)
            cargo test -p "$crate" --no-fail-fast > "$RUNNER_TEMP/rust-$crate.log" 2>&1
            rc=$?
            { echo "===== cargo test -p $crate (exit $rc)"; cat "$RUNNER_TEMP/rust-$crate.log"; } >> "$log"
            read -r p f < <(grep -a '^test result:' "$RUNNER_TEMP/rust-$crate.log" | awk '
              { for (i = 1; i < NF; i++) {
                  if ($(i + 1) ~ /^passed;?$/) p += $i
                  if ($(i + 1) ~ /^failed;?$/) f += $i } }
              END { print p + 0, f + 0 }')
            wall=$(( $(date +%s) - t ))
            echo "$crate: exit $rc passed $p failed $f wall ${wall}s"
            lines="$lines $crate=$p/$((p + f)):${wall}s"
            passed=$((passed + p)); failed=$((failed + f))
            if [ "$rc" -ne 0 ] && [ "$f" -eq 0 ]; then broken="$broken $crate"; fi
          done
          echo "rust tests: passed $passed failed $failed did-not-build:${broken:- none}"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "broken=${broken# }" >> "$GITHUB_OUTPUT"
          echo "crates=${lines# }" >> "$GITHUB_OUTPUT"
          grep -a -E '^test .* FAILED$|^error(\[|:)' "$log" | head -n 50
          true
      - name: Post the rust number
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RUST_PASSED: ${{ steps.cargo.outputs.passed }}
          RUST_FAILED: ${{ steps.cargo.outputs.failed }}
          RUST_BROKEN: ${{ steps.cargo.outputs.broken }}
          RUST_CRATES: ${{ steps.cargo.outputs.crates }}
        run: |
          set +e -uo pipefail
          if [ -z "$RUST_PASSED" ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set rust.measured=false --set "rust.note=cargo test did not run"
          elif [ -n "$RUST_BROKEN" ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set rust.measured=false \
              --set "rust.note=did not build: $RUST_BROKEN ($RUST_CRATES)"
          else
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set "rust.passed=$RUST_PASSED" \
              --set "rust.failed=$RUST_FAILED" \
              --set "rust.total=$(( RUST_PASSED + RUST_FAILED ))" \
              --set "rust.crates=$RUST_CRATES"
          fi
      - name: Upload rust log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-rust
          path: rust.log
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # ------------------------------------------------------- (5) scorecard
  # Each measuring job already posted its number. This job closes the row:
  # a measure that never reported becomes unmeasured, and is compared.
  scorecard:
    name: scorecard (final row)
    needs: [gate, suite, suite-shard, suite-join, federation, rust]
    if: ${{ !cancelled() && needs.gate.outputs.measure != 'false' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Final row
        shell: bash
        run: |
          set +e -uo pipefail
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" --final
      - name: Store housekeeping (every 20th run)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          if [ $(( GITHUB_RUN_NUMBER % 20 )) -ne 0 ]; then echo "housekeeping skipped"; exit 0; fi
          # The store holds only the federation verdicts; whatever else is
          # there is the deleted carry recorder's records (#8416).
          for entry in "$SCORECARD_STORE"/*; do
            [ -e "$entry" ] && [ "$(basename "$entry")" != verdicts ] && rm -rf "$entry"
          done
          find "$SCORECARD_CACHE/runs" -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} +
