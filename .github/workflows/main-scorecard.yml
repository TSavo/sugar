name: Main scorecard

# WHY THIS EXISTS
#
# CI must measure main. Before this workflow:
# - the package suite on main never completed: every merge replaced the
#   pending run (python-package-suite.yml concurrency is workflow-ref);
# - the pandas board ran only by hand (/home/tsavo/sugar-pass-kit/run.sh);
# - the solver twins and examples/python-base64-federation/run.sh ran nowhere.
#
# This workflow measures the tip of main on every merge (push to main), once
# an hour, and on demand, and posts one row of numbers on the "Main scorecard"
# issue. Its concurrency group is its own with cancel-in-progress false: one
# run measures while the newest trigger waits. Every job checks out
# github.sha, so every number in a row is about one commit, and the row names
# the PRs merged since the previous row.
#
# THE BOARD HAS ITS OWN LANE (2026-11-15)
#
# This workflow measures the package suite, the solver twins and the
# federation example. The pandas board is main-scorecard-board.yml, with its
# own concurrency group: while the board was a job here, one run held the
# group until the board finished (over an hour), so merges got no row in
# between. Both workflows post rows on the same issue; each names its numbers
# in SCORECARD_MEASURES and writes `-` for the other's.
#
# A ROW IN SECONDS, NOT HOURS (owner, 2026-11-14)
#
# The first run posted nothing for over an hour: every job rebuilt the
# environment, everything was measured from scratch, and the row was written
# only after the slowest job. Now:
#
# 1. Incremental. tools/scorecard_carry.py records, per pytest test and per
#    pandas board file, the fingerprint of every first-party function it
#    executed and the blob of every tracked file it read, in a
#    content-addressed store on the runner host. A run reruns only the tests
#    and board files whose recorded dependencies changed in this SHA and
#    carries every other result forward; a test file whose every test is
#    carried never starts pytest. The numbers are always full totals for the
#    SHA, and the row says how many were rerun and how many carried. The
#    store is keyed by interpreter + installed distributions + the carry
#    module: a new key starts empty, so that run re-measures everything once
#    and refills it. (The pandas-walking unit tests are carried like any
#    other test: the corpus is pinned by the key.)
# 2. Zero setup. tools/main_scorecard_env.sh keeps one persistent venv per
#    dependency key in the cache directory every runner shares (pandas
#    pinned with it) and puts gh on PATH; the sugar binary comes from
#    bin/sugarbin's shelf; z3 is installed once; the Rust toolchain is set
#    up only when something will actually run.
# 3. Each job posts its own number. A measuring job banks its result in the
#    run's shared directory and creates or edits the run's comment at once
#    (tools/main_scorecard_post.py); anything still measuring is `?` and
#    named pending. The final scorecard job marks whatever never reported as
#    unmeasured.
#
# Regression alarm: each number is compared with the newest earlier row in
# which it was measured. Any number that got worse (or was measured before
# and is unmeasured now) makes the comment start with REGRESSION: and turns
# the posting job red. Pending numbers are never compared.
#
# GitHub runs `shell: bash` as `bash -e`: every step whose commands may exit
# nonzero on purpose (pytest, run.sh, the recensus) says `set +e` (#8293).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: main-scorecard-fast
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SUITE_SHARD_COUNT: "8"
  # More test files than this to rerun -> fan out to SUITE_SHARD_COUNT jobs.
  SUITE_INLINE_MAX_FILES: "40"
  SCORECARD_ISSUE_TITLE: "Main scorecard"
  # The numbers this workflow reports; the board is main-scorecard-board.yml.
  SCORECARD_MEASURES: "suite,twins,federation"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # ------------------------------------------------------- (1) package suite
  suite:
    name: package suite
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    outputs:
      fanout: ${{ steps.plan.outputs.fanout }}
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Plan (which test files have a changed dependency)
        id: plan
        shell: bash
        working-directory: implementations/python
        run: |
          set -euo pipefail
          mkdir -p "$SCORECARD_RUNS/suite"
          python "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --shard-count 1 --shard-index 0 \
            --emit-paths-for-cwd > "$RUNNER_TEMP/suite-paths.txt"
          python "$GITHUB_WORKSPACE/tools/scorecard_carry.py" suite-plan \
            --store "$SCORECARD_STORE" --label suite \
            --paths-file "$RUNNER_TEMP/suite-paths.txt" \
            --summary "$SCORECARD_RUNS/suite/plan.json" \
            --rerun-paths "$RUNNER_TEMP/suite-rerun.txt"
          n="$(grep -c . "$RUNNER_TEMP/suite-rerun.txt" || true)"
          echo "rerun=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt "$SUITE_INLINE_MAX_FILES" ]; then fanout=true; else fanout=false; fi
          echo "fanout=$fanout" >> "$GITHUB_OUTPUT"
          echo "suite files to run: $n (fan out: $fanout)"
      - name: Set up Rust toolchain (only when tests run here)
        if: steps.plan.outputs.rerun != '0' && steps.plan.outputs.fanout == 'false'
        uses: ./.github/actions/setup-rust-cache
      - name: Run the files with a changed dependency
        if: steps.plan.outputs.rerun != '0' && steps.plan.outputs.fanout == 'false'
        shell: bash
        working-directory: implementations/python
        run: |
          set +e -uo pipefail
          export SUGAR_BIN="$("$GITHUB_WORKSPACE/bin/sugarbin" --profile release)"
          mapfile -t paths < "$RUNNER_TEMP/suite-rerun.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools:$PYTHONPATH" python -m pytest "${paths[@]}" -q \
            -p no:cacheprovider -p no:randomly \
            -p scorecard_carry_pytest \
            --carry-store "$SCORECARD_STORE" --carry-label suite \
            --carry-summary "$SCORECARD_RUNS/suite/inline.json" \
            > "$GITHUB_WORKSPACE/suite.log" 2>&1
          echo "pytest exit $? (evidence only)"
          grep -a 'SCORECARD CARRY' "$GITHUB_WORKSPACE/suite.log"
      - name: Post the suite number
        if: ${{ !cancelled() && steps.plan.outputs.fanout != 'true' }}
        shell: bash
        run: |
          set +e -uo pipefail
          python3 tools/scorecard_carry.py summarize --label suite \
            --out "$RUNNER_TEMP/suite-totals.json" \
            --result "$RUNNER_TEMP/suite-result.json" \
            "$SCORECARD_RUNS"/suite/*.json
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
            --put "suite=$RUNNER_TEMP/suite-result.json"
      - name: Upload suite log
        if: ${{ !cancelled() && steps.plan.outputs.rerun != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-suite
          path: suite.log
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # Empty store or a wide change: the files to run fan out over shards.
  suite-shard:
    name: suite shard ${{ matrix.shard }}
    needs: [suite]
    if: ${{ !cancelled() && needs.suite.outputs.fanout == 'true' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-cache
      - name: Shard ${{ matrix.shard }}
        shell: bash
        working-directory: implementations/python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e -uo pipefail
          tag="$(printf '%02d' "$SHARD")"
          python "$GITHUB_WORKSPACE/tools/python_package_suite_shards.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --shard-count "$SUITE_SHARD_COUNT" --shard-index "$SHARD" \
            --emit-paths-for-cwd > "$RUNNER_TEMP/paths.txt"
          python "$GITHUB_WORKSPACE/tools/scorecard_carry.py" suite-plan \
            --store "$SCORECARD_STORE" --label suite \
            --paths-file "$RUNNER_TEMP/paths.txt" \
            --summary "$SCORECARD_RUNS/suite/plan-s$tag.json" \
            --rerun-paths "$RUNNER_TEMP/rerun.txt"
          mapfile -t paths < "$RUNNER_TEMP/rerun.txt"
          echo "shard $SHARD files to run: ${#paths[@]}"
          if [ "${#paths[@]}" -gt 0 ]; then
            export SUGAR_BIN="$("$GITHUB_WORKSPACE/bin/sugarbin" --profile release)"
            PYTHONPATH="$GITHUB_WORKSPACE/tools:$PYTHONPATH" python -m pytest "${paths[@]}" -q \
              -p no:cacheprovider -p no:randomly \
              -p scorecard_carry_pytest \
              --carry-store "$SCORECARD_STORE" --carry-label suite \
              --carry-summary "$SCORECARD_RUNS/suite/shard-$tag.json" \
              > "$GITHUB_WORKSPACE/suite.log" 2>&1
            echo "pytest exit $? (evidence only)"
            grep -a 'SCORECARD CARRY' "$GITHUB_WORKSPACE/suite.log"
          fi
      - name: Upload shard log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-suite-shard-${{ matrix.shard }}
          path: suite.log
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  suite-join:
    name: suite join
    needs: [suite, suite-shard]
    if: ${{ !cancelled() && needs.suite.outputs.fanout == 'true' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Post the suite number
        shell: bash
        run: |
          set +e -uo pipefail
          python3 tools/scorecard_carry.py summarize --label suite \
            --out "$RUNNER_TEMP/suite-totals.json" \
            --result "$RUNNER_TEMP/suite-result.json" \
            "$SCORECARD_RUNS"/suite/*.json
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
            --put "suite=$RUNNER_TEMP/suite-result.json"

  # ------------------------------------- (2) solver twins + (3) federation
  solver:
    name: solver twins + federation
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Start the job clock
        shell: bash
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Plan
        id: plan
        shell: bash
        working-directory: implementations/python
        run: |
          set -euo pipefail
          mkdir -p "$SCORECARD_RUNS/twins"
          # Every test file that drives a source through the real solver.
          git grep -l run_source_through_real_solver -- '*/tests/test_*.py' \
            > "$RUNNER_TEMP/twins-paths.txt" || true
          echo "real-solver twin files: $(grep -c . "$RUNNER_TEMP/twins-paths.txt" || true)"
          python "$GITHUB_WORKSPACE/tools/scorecard_carry.py" suite-plan \
            --store "$SCORECARD_STORE" --label twins \
            --paths-file "$RUNNER_TEMP/twins-paths.txt" \
            --summary "$SCORECARD_RUNS/twins/plan.json" \
            --rerun-paths "$RUNNER_TEMP/twins-rerun.txt"
          echo "twins_rerun=$(grep -c . "$RUNNER_TEMP/twins-rerun.txt" || true)" >> "$GITHUB_OUTPUT"
          # The federation example is a chain of subprocesses, so it is not
          # traced: a PASS is carried only while every input outside docs/
          # and the other examples is byte-identical (git tree hashes). A
          # FAIL is never carried.
          cd "$GITHUB_WORKSPACE"
          key="$(python tools/scorecard_carry.py verdict key \
            --exclude docs --exclude examples \
            --include examples/python-base64-federation \
            --extra "z3=$(z3 --version 2>/dev/null || echo none)")"
          echo "fed_key=$key" >> "$GITHUB_OUTPUT"
          if [ "$(python tools/scorecard_carry.py verdict get --store "$SCORECARD_STORE" \
                --name python-base64-federation --key "$key" 2>/dev/null || true)" = PASS ]; then
            echo "fed_carried=true" >> "$GITHUB_OUTPUT"
          else
            echo "fed_carried=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Rust toolchain (only when something runs)
        if: steps.plan.outputs.twins_rerun != '0' || steps.plan.outputs.fed_carried != 'true'
        uses: ./.github/actions/setup-rust-cache
      - name: Install z3 (cached on the runner)
        if: steps.plan.outputs.twins_rerun != '0' || steps.plan.outputs.fed_carried != 'true'
        shell: bash
        run: tools/ci-apt-install.sh z3
      - name: Run the twins with a changed dependency
        if: steps.plan.outputs.twins_rerun != '0'
        shell: bash
        working-directory: implementations/python
        run: |
          set +e -uo pipefail
          export SUGAR_BIN="$("$GITHUB_WORKSPACE/bin/sugarbin" --profile release)"
          # Each twin keeps its source, lift doc and prove doc here; uploaded
          # with the logs so a failing twin is diagnosed from CI's artifact.
          rm -rf "$GITHUB_WORKSPACE/twin-evidence"
          export SUGAR_WITNESS_EVIDENCE_DIR="$GITHUB_WORKSPACE/twin-evidence"
          mapfile -t files < "$RUNNER_TEMP/twins-rerun.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/tools:$PYTHONPATH" python -m pytest "${files[@]}" -q \
            -p no:cacheprovider -p no:randomly \
            -p scorecard_carry_pytest \
            --carry-store "$SCORECARD_STORE" --carry-label twins \
            --carry-summary "$SCORECARD_RUNS/twins/run.json" \
            > "$GITHUB_WORKSPACE/twins.log" 2>&1
          echo "pytest exit $? (evidence only)"
          grep -a 'SCORECARD CARRY' "$GITHUB_WORKSPACE/twins.log"
      - name: Post the twins number
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          python3 tools/scorecard_carry.py summarize --label twins \
            --out "$RUNNER_TEMP/twins-totals.json" \
            --result "$RUNNER_TEMP/twins-result.json" \
            "$SCORECARD_RUNS"/twins/*.json
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
            --put "twins=$RUNNER_TEMP/twins-result.json"
      - name: Run examples/python-base64-federation/run.sh
        id: fed
        if: ${{ !cancelled() && steps.plan.outputs.fed_carried != 'true' }}
        shell: bash
        env:
          FED_KEY: ${{ steps.plan.outputs.fed_key }}
        run: |
          set +e -uo pipefail
          export PYTHON_LITERAL_BASE64_VENV="$SCORECARD_CACHE/python-literal-base64-venv"
          bash examples/python-base64-federation/run.sh > federation.log 2>&1
          rc=$?
          cat federation.log
          if [ "$rc" -eq 0 ]; then verdict=PASS; else verdict=FAIL; fi
          last_fail="$(grep -a 'FAIL' federation.log | tail -n 1 | tr -d '\r' | cut -c1-200)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "last_fail=$last_fail" >> "$GITHUB_OUTPUT"
          echo "federation rc=$rc verdict=$verdict last_fail=$last_fail"
          if [ "$verdict" = PASS ] && [ -n "$FED_KEY" ]; then
            python tools/scorecard_carry.py verdict put --store "$SCORECARD_STORE" \
              --name python-base64-federation --key "$FED_KEY" --value PASS
          fi
      - name: Post the federation verdict
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FED_CARRIED: ${{ steps.plan.outputs.fed_carried }}
          FED_VERDICT: ${{ steps.fed.outputs.verdict }}
          FED_LAST_FAIL: ${{ steps.fed.outputs.last_fail }}
        run: |
          set +e -uo pipefail
          if [ "$FED_CARRIED" = true ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set federation.verdict=PASS --set federation.carried=true
          elif [ -n "$FED_VERDICT" ]; then
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set "federation.verdict=$FED_VERDICT" \
              --set "federation.last_fail=$FED_LAST_FAIL"
          else
            python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" \
              --set federation.measured=false \
              --set "federation.note=run.sh did not run"
          fi
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-scorecard-solver
          path: |
            twins.log
            federation.log
            twin-evidence/**
          if-no-files-found: ignore
      - name: Job wall time
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "job wall $(( $(date +%s) - JOB_T0 ))s"

  # ------------------------------------------------------- (5) scorecard
  # Each measuring job already posted its number. This job closes the row:
  # a measure that never reported becomes unmeasured, and is compared.
  scorecard:
    name: scorecard (final row)
    needs: [suite, suite-shard, suite-join, solver]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Scorecard environment (persistent venv, gh)
        shell: bash
        run: bash tools/main_scorecard_env.sh
      - name: Final row
        shell: bash
        run: |
          set +e -uo pipefail
          python3 tools/main_scorecard_post.py --runs "$SCORECARD_RUNS" --final
      - name: Store housekeeping (every 20th run)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -uo pipefail
          if [ $(( GITHUB_RUN_NUMBER % 20 )) -ne 0 ]; then echo "housekeeping skipped"; exit 0; fi
          python tools/scorecard_carry.py gc --store "$SCORECARD_STORE"
          find "$SCORECARD_CACHE/runs" -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} +
