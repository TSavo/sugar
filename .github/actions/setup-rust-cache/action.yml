name: Set up Sugar Rust toolchain
description: >
  Use the pinned Rust toolchain (sugar-build.toml) from the runner's own
  rustup, with no network when it is installed; only a missing rustup,
  toolchain or component is downloaded, under a bounded retry
  (tools/ci-rust-toolchain.sh, #8416). Binary construction and reuse are
  owned by bin/sugarbin (content-addressed filesystem shelf). There is no
  second cargo-target cache door and no github.sha keying.

inputs:
  mode:
    description: "Ignored (legacy seed/consume/restore/save). Kept so call sites do not break."
    required: false
    default: restore
  components:
    description: Additional rustup components
    required: false
    default: rustfmt

runs:
  using: composite
  steps:
    # Not dtolnay/rust-toolchain: on the self-hosted runners it re-ran the
    # rustup installer and re-fetched the channel manifest every job, and one
    # TLS reset there lost a whole suite shard (run 43832361876).
    - name: Rust toolchain from the runner's rustup
      shell: bash
      env:
        SUGAR_RUST_COMPONENTS: ${{ inputs.components }}
      run: bash tools/ci-rust-toolchain.sh

    - name: Ensure sugarbin hash tool (b3sum)
      shell: bash
      run: |
        # tools/ci-apt-install.sh owns b3sum acquisition and pins the version
        # from sugar-build.toml. The old fallback here was an unpinned
        # `cargo install b3sum --locked`, which could put a different hashing
        # tool version on PATH than the one the build contract names.
        tools/ci-apt-install.sh b3sum
        b3sum --version | head -1
