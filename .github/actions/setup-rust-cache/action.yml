name: Set up Sugar Rust toolchain
description: >
  Install the pinned Rust toolchain only. Binary construction and reuse are
  owned by bin/sugarbin (content-addressed filesystem shelf). There is no
  second cargo-target cache door and no github.sha keying.

inputs:
  mode:
    description: "Ignored (legacy seed/consume/restore/save). Kept so call sites do not break."
    required: false
    default: restore
  components:
    description: Additional rustup components
    required: false
    default: rustfmt

runs:
  using: composite
  steps:
    - name: Set up Rust 1.96.0
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: ${{ inputs.components }}

    - name: Ensure sugarbin hash tool (b3sum)
      shell: bash
      run: |
        # tools/ci-apt-install.sh owns b3sum acquisition and pins the version
        # from sugar-build.toml. The old fallback here was an unpinned
        # `cargo install b3sum --locked`, which could put a different hashing
        # tool version on PATH than the one the build contract names.
        tools/ci-apt-install.sh b3sum
        b3sum --version | head -1
