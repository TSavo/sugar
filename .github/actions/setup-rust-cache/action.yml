name: Set up Sugar Rust toolchain
description: >
  Install the pinned Rust toolchain only. Binary construction and reuse are
  owned by bin/sugarbin (content-addressed filesystem shelf). There is no
  second cargo-target cache door and no github.sha keying.

inputs:
  mode:
    description: "Ignored (legacy seed/consume/restore/save). Kept so call sites do not break."
    required: false
    default: restore
  components:
    description: Additional rustup components
    required: false
    default: rustfmt

runs:
  using: composite
  steps:
    - name: Set up Rust 1.96.0
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: ${{ inputs.components }}

    - name: Ensure sugarbin hash tool (b3sum)
      shell: bash
      run: |
        if ! command -v b3sum >/dev/null 2>&1; then
          tools/ci-apt-install.sh b3sum || cargo install b3sum --locked
        fi
        b3sum --version | head -1
