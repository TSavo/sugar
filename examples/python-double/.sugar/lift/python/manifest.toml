name = "python-lift"
version = "0.1.0-draft"
protocol_version = "pep/1.7.0"
kind = "lift"
# The one Python kit: `sugar.enumerate` over the node tree. PYTHONPATH points
# at the checkout so the example stays runnable from the repository. The kit's
# src trees go in front of the caller's PYTHONPATH, never in place of it.
command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec python3 -m sugar_lift_py_tests.lift_rpc --rpc',
]
working_dir = "."

[capabilities]
authoring_surfaces = ["python"]
ir_version = "v1.1.0"
emits_signed_mementos = false
