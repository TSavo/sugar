name = "pytest-witness-lift"
version = "0.1.0-draft"
protocol_version = "pep/1.7.0"
kind = "lift"
# The kit's src trees go IN FRONT of the caller's PYTHONPATH, never in place of
# it: the witness runs the project's own tests, whose imports resolve on the
# caller's PYTHONPATH.
# The kit's lift entry (RUNS the test, emits the witnessed contract). The
# witness lifter executes real pandas, so its interpreter is the pandas venv.
command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/pandas-witness-venv/bin/python -m sugar_pytest_witness.lift_lsp',
]
# The kit's DISCHARGE entry (re-runs the test to settle the witness). It takes
# `<witness.proof> <project_dir>`, so the arguments appended after the trailing
# "sh" ($0) are forwarded.
discharge_command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/pandas-witness-venv/bin/python -m sugar_pytest_witness.discharge_cli "$@"',
    "sh",
]
witness_tool = "pytest"
# The kit's WITNESS-RESOLVE entry. The rust verifier blake3's the resolved bytes
# itself and compares to the pinned witness_cid -- the kit oracle is UNTRUSTED.
resolve_witness_command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/pandas-witness-venv/bin/python -m sugar_pytest_witness.lift_lsp',
]
resolve_witness_method = "sugar.plugin.resolve_witness"
working_dir = "."

[capabilities]
authoring_surfaces = ["python-pytest-witness"]
