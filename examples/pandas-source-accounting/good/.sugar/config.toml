# pandas source-accounting: one Python test-assertion lift surface, with the
# kit shim pointing at an installed pandas source tree through PYTHONPATH.

[[plugins]]
name = "python-tests-lift"
kind = "lift"
surface = "python-tests"

[solvers]
default = "z3"

[solvers.dispatch]
linear_arithmetic = "z3"
default = "z3"

[solvers.z3]
binary = "z3"
flags = ["-smt2", "-in"]
