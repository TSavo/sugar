# python-urlsafe-seam twin: current python-lift surface + z3 seat. The
# literal-call equality mints; the URL-safe alphabet universe row is the
# remaining named proof gap tracked by the examples gate.

[[plugins]]
name = "python-lift"
kind = "lift"
surface = "python"
emit = "ir-document"

[solvers]
default = "z3"

[solvers.dispatch]
linear_arithmetic = "z3"
default = "z3"

[solvers.z3]
binary = "z3"
flags = ["-smt2", "-in"]
