name = "python-numpy-testing-lift"
version = "0.1.0-draft"
protocol_version = "pep/1.7.0"
kind = "lift"
# The Python factory lift RPC handles the numpy testing surface in the same
# batch protocol as the plain Python seat. The interpreter must be a
# numpy-bearing python so source resolution and helper imports see the same
# environment as the witness run.
command = [
    "/usr/bin/env",
    "PYTHONPATH=../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src",
    "/tmp/numpy-witness-venv/bin/python",
    "-m",
    "sugar_lift_py_tests.lift_rpc",
    "--rpc",
]
working_dir = "."

[capabilities]
authoring_surfaces = ["python-numpy-testing"]
ir_version = "v1.1.0"
emits_signed_mementos = false
