name = "python-pandas-testing-lift"
version = "0.1.0-draft"
protocol_version = "pep/1.7.0"
kind = "lift"
# The Python factory lift RPC handles the pandas testing surface in the same
# batch protocol as the plain Python seat. The interpreter is the witness venv
# so imports used by source scanning and helper resolution see pandas.
command = [
    "/usr/bin/env",
    "PYTHONPATH=../../implementations/python/sugar-lift-py-tests/src",
    "/tmp/pandas-witness-venv/bin/python",
    "-m",
    "sugar_lift_py_tests.lift_rpc",
    "--rpc",
]
working_dir = "."

[capabilities]
authoring_surfaces = ["python-pandas-testing"]
ir_version = "v1.1.0"
emits_signed_mementos = false
