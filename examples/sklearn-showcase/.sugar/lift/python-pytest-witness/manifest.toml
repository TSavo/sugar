name = "pytest-witness-lift"
version = "0.1.0-draft"
protocol_version = "pep/1.7.0"
kind = "lift"
# The witness lifter runs the real sklearn tests in the venv. The kit's src
# trees go IN FRONT of the caller's PYTHONPATH, never in place of it: the
# project's own imports resolve on the caller's PYTHONPATH.
command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/sklearn-witness-venv/bin/python -m sugar_pytest_witness.lift_lsp',
]
# The discharge entry takes `<witness.proof> <project_dir>`, so the arguments
# appended after the trailing "sh" ($0) are forwarded.
discharge_command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/sklearn-witness-venv/bin/python -m sugar_pytest_witness.discharge_cli "$@"',
    "sh",
]
witness_tool = "pytest"
resolve_witness_command = [
    "/bin/sh",
    "-c",
    'export PYTHONPATH="../../implementations/python/sugar-lift-py-pytest-witness/src:../../implementations/python/sugar-lift-py-tests/src:../../implementations/python/sugar-lift-python-source/src${PYTHONPATH:+:$PYTHONPATH}"; exec /tmp/sklearn-witness-venv/bin/python -m sugar_pytest_witness.lift_lsp',
]
resolve_witness_method = "sugar.plugin.resolve_witness"
working_dir = "."

[capabilities]
authoring_surfaces = ["python-pytest-witness"]
