version = 1

[ratchet]
interfaces_without_declaration = 0
undeclared_escape_hatches = 0
declared_escape_hatch_rows_open = 6
ambient_testimony_sites = 0
frontend_provenance_unadmitted = 0
untyped_verifier_obligation_paths = 0

[[pipeline_seams]]
root = "implementations/rust/sugar-cli/src"
file_prefixes = [
  "component_plan",
  "project_config",
  "lift_plugin",
  "cmd_prove",
  "report_witness",
]

[[pipeline_seams]]
root = "implementations/rust/sugar-verifier/src"
file_prefixes = [
  "solvers/mod",
  "runner",
]

[[pipeline_seams]]
