[[interfaces]]
id = "component-plan"
owner = "sugar-cli::component_plan"
input_type = "project root + ComponentPlanOptions + PlanIntent"
output_type = "ComponentPlan"
addressing_rule = "component manifests are discovered from component.toml roots; replay pins the selected PlannedLiftManifest/PlannedIrCompiler data"
failure_type = "ComponentDiagnostic with DiagnosticLevel"
replay_inputs = [
  "project root",
  "component manifests",
  "ComponentPlanOptions",
  "PlanIntent",
]
source = { path = "implementations/rust/sugar-cli/src/component_plan.rs", item = "ComponentPlan", kind = "struct" }

