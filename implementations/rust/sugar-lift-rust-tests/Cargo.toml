[package]
name = "sugar-lift-rust-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Sugar Rust test-assertion consistency lifter: lift #[test] scalar assertions into inv-only closed consistency contracts."
build = "build.rs"

[lib]
doctest = false

[dependencies]
sugar-floor-algebra = { path = "../sugar-floor-algebra" }
sugar-ir-symbolic = { path = "../sugar-ir-symbolic" }
# RegexSugar: the SINGLE regex→RegLan lowering authority (`regex_regln`). The
# lifter calls `regex_to_regln` ONLY as a pure regularity GATE at lift time — to
# REFUSE a non-regular pattern (backreference/lookahead/…) BY NAME before emitting
# a `str.in-regex` row, mirroring the Java `PatternUniverseWalker` which refuses
# non-regular patterns at walk time (no row, the floor stands). The actual SMT
# rendering still happens at prove time in the compiler; this is the same pure
# function, reused so both languages share ONE regularity verdict (no second
# regex parser, no drift). The Step-7 composition check also feeds emitted
# ProofIR through this compiler.
sugar-ir-compiler-smt-lib = { path = "../sugar-ir-compiler-smt-lib" }
sugar-ir-compiler = { path = "../sugar-ir-compiler" }
sugar-canonicalizer = { path = "../sugar-canonicalizer" }
sugar-proof-envelope = { path = "../sugar-proof-envelope" }
sugar-verifier = { path = "../sugar-verifier" }
# Oracle slice: query the resident RA host (sugar-linkerd) for method-call
# receiver/param mutability over RPC.
sugar-walk = { path = "../sugar-walk" }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde_json = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
syn = { workspace = true }
walkdir = { workspace = true }

[[bin]]
name = "rust_test_assertions_rpc"
path = "src/bin/rust_test_assertions_rpc.rs"

[[bin]]
name = "coretests_sweep"
path = "src/bin/coretests_sweep.rs"

[[bin]]
name = "discharge_sweep"
path = "src/bin/discharge_sweep.rs"
