[package]
name = "sugar-ra-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Resident rust-analyzer oracle daemon for the Rust lift pipeline. Serves rustAnalyzerReady/resolveReceiverCrate to sugar-walk::ra_daemon_client over the linkerd wire protocol (daemon-1: oracle extracted from sugar-linkerd)."

[lib]
name = "sugar_ra_oracle"
path = "src/lib.rs"

[[bin]]
name = "sugar-ra-oracle"
path = "src/main.rs"

[dependencies]
sugar-canonicalizer = { path = "../sugar-canonicalizer" }
# Shared RA LSP client (`ra_oracle`): the SAME framing/quiescence/resolve logic
# the per-mint binary used to cold-spawn, and the same module sugar-linkerd's
# ra_host used before this extraction. `default-features = false` keeps the
# heavy `rpc`/realize feature out of this oracle binary; `ra_oracle` needs only
# serde_json/tracing/std.
sugar-walk = { path = "../sugar-walk", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Walk the workspace .rs tree to fold cross-file source state into the
# resolution-context cache key (see resolve_cache::resolution_context_cid).
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
