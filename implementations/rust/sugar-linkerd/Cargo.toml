[package]
name = "sugar-linkerd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Long-running JSON-RPC daemon that serves the sugar linker to per-kit LSP plugins. Implements spec 2026-05-04-linker-daemon-protocol.md."

[[bin]]
name = "sugar-linkerd"
path = "src/main.rs"

[dependencies]
sugar-linker = { path = "../sugar-linker" }
sugar-lift = { path = "../sugar-lift" }
# Resident prove context (#3774 warm-daemon slice): the daemon calls the SAME
# verify_consistency construction `sugar prove` uses, never a reimplementation.
sugar-verifier = { path = "../sugar-verifier" }
sugar-ir-compiler = { path = "../sugar-ir-compiler" }
sugar-canonicalizer = { path = "../sugar-canonicalizer" }
sugar-ir-symbolic = { path = "../sugar-ir-symbolic" }
sugar-claim-envelope = { path = "../sugar-claim-envelope" }
# Resident rust-analyzer host: import the shared RA LSP client (`ra_oracle`) so
# the daemon drives the SAME framing/quiescence/resolve logic the per-mint binary
# used to cold-spawn. `default-features = false` keeps the heavy `rpc`/realize
# feature out of the daemon; `ra_oracle` needs only serde_json/tracing/std.
sugar-walk = { path = "../sugar-walk", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Walk the workspace .rs tree to fold cross-file source state into the
# resolution-context cache key (see resolve_cache::resolution_context_cid).
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
sugar-ir-compiler-smt-lib = { path = "../sugar-ir-compiler-smt-lib" }
