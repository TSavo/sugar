[package]
name = "sugar-lsp"
publish = false
version = "0.0.1"
edition = "2021"
authors = ["Sugar Contributors"]
description = "Language Server Protocol implementation for Sugar. Delegates verification to configurable JSON-RPC backends."
license = "MIT OR Apache-2.0"

[lib]
name = "sugar_lsp"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "sugar-lsp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time"] }
tower-lsp = "0.20"
toml = "0.8"
# THE TERMINUS (lsp-links-engine lane): prove buffers IN-PROCESS by linking
# the engine directly -- no daemon RPC, no subprocess solver (the daemon this
# once routed through, sugar-linkerd, is retired; see #3844 + daemon-3-delete):
# sugar-verifier owns the resident pool / consistency index / solve door;
# sugar-compiler owns enumerate→fold feed (`fold_project` / `pool_from_graph_with_speaker`);
# sugar-cli owns project config + lift manifest resolution for kit rendezvous.
sugar-verifier = { path = "../sugar-verifier" }
sugar-proof-envelope = { path = "../sugar-proof-envelope" }
sugar-cli = { path = "../sugar-cli" }
sugar-compiler = { path = "../sugar-compiler" }
sugar-ir-compiler = { path = "../sugar-ir-compiler" }
sugar-canonicalizer = { path = "../sugar-canonicalizer" }
libsugar = { path = "../libsugar" }
walkdir = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.14"
libc = "0.2"
sugar-ir-compiler-smt-lib = { path = "../sugar-ir-compiler-smt-lib" }
sugar-claim-envelope = { path = "../sugar-claim-envelope" }
sugar-canonicalizer = { path = "../sugar-canonicalizer" }
sugar-cli = { path = "../sugar-cli" }
sugar-verifier = { path = "../sugar-verifier" }
