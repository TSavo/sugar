[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-lift-py-tests"
version = "0.1.0"
description = "Sugar: Python pytest/unittest structural lifts plus production callsite WP walking."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Sugar" }]
dependencies = [
    "blake3>=0.3.0",
    "pynacl>=1.5",
    "cbor2>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7", "black==26.5.1", "pyright==1.1.411", "itsdangerous==2.2.0"]

[project.scripts]
sugar-lift-python = "sugar_lift_py_tests.lift_rpc:main"
sugar-python-factory-floor-idd = "sugar_lift_py_tests.idd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the committed community manifest(s) with the built package. Without this
# the installed package lacks manifests/community_context_managers.json, so
# default_community_manifest() fails to load and the membrane can no longer
# recognize community context managers (pytest.raises, contextlib.suppress),
# which reappear as false bare-exception rows and block files from measuring.
[tool.setuptools.package-data]
sugar_lift_py_tests = ["manifests/*.json"]
