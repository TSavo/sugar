[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-lift-py-tests"
version = "0.1.0"
description = "Sugar: Python pytest/unittest structural lifts plus production callsite WP walking."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Sugar" }]
# Runtime deps: installing this package (with or without extras) is the sole
# authority for blake3 / pynacl / cbor2 / tqdm. Workflows must not re-list them.
dependencies = [
    "blake3>=0.3.0",
    "pynacl>=1.5",
    "cbor2>=5.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Test authority: pytest and suite tooling. Workflows install
# `sugar-lift-py-tests[test]` — never a bare `pytest` pin.
test = ["pytest>=7", "black==26.5.1", "pyright==1.1.411", "itsdangerous==2.2.0"]
# Corpus / wall inputs — named extras, not free-floating workflow pins.
numpy = ["numpy"]
pandas = ["pandas"]
scikit-learn = ["scikit-learn"]
# Convenience composite for walls + restored suite that need both corpora.
walls = ["numpy", "pandas"]

[project.scripts]
sugar-lift-python = "sugar_lift_py_tests.lift_rpc:main"
sugar-python-factory-floor-idd = "sugar_lift_py_tests.idd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
