[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-source-tree"
version = "0.1.0"
description = "A parser and a source tree (#5940): SourceTree enumerates SourceFile enumerates nodes, read through CPython's ast. Built on top of the SourceOracle: text enters only as the oracle's (source, filename, CID) identity."
requires-python = ">=3.12"
# The oracle (sugar-lift-python-source) is the ONE text/address authority;
# this parser is built on top of it. It is a sibling package in this repo:
#   pip install -e ../sugar-lift-python-source -e .
dependencies = ["sugar-lift-python-source"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "../sugar-lift-python-source/src",
    "src",
    "../sugar-lift-py-tests/src",
]
